name: Restore thesis stored IO evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-thesis-structure-fix.yml'

permissions:
  contents: write

jobs:
  validate-committed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make workbook validator namespace-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('FINALDOCS/VALIDATION/verify_finaldocs_60q.py')
          text = path.read_text(encoding='utf-8')
          old = '''    sheet_names = re.findall(r'<sheet[^>]+name="([^\"]+)"', workbook)\n'''
          new = '''    sheet_names = re.findall(r'<(?:[A-Za-z_][\\w.-]*:)?sheet[^>]+name="([^\"]+)"', workbook)\n'''
          if old not in text:
              raise RuntimeError('workbook sheet-name regex not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Refresh evidence manifest hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path.cwd()
          path = root / 'FINALDOCS/DATA/evidence_manifest_60q.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          for rel in list(data['sources']):
              src = root / rel.replace('\\', '/')
              if not src.is_file():
                  raise FileNotFoundError(src)
              data['sources'][rel] = hashlib.sha256(src.read_bytes()).hexdigest()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate and capture diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py > FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt 2>&1
          rc=$?
          cat FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate diff
        run: git diff --check
      - name: Commit validation fixes and diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINALDOCS/VALIDATION/verify_finaldocs_60q.py FINALDOCS/DATA/evidence_manifest_60q.json FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(thesis): harden workbook validator for IO evidence package'
            git push origin HEAD:main
          fi
      - name: Fail if validator failed
        if: steps.validate.outputs.rc != '0'
        run: exit 1
