name: Restore thesis stored IO evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-thesis-structure-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore stored experiment IO evidence
        shell: bash
        run: |
          git checkout a4ba85276754bfde1b519a87850c1f9eb5c007e6 -- FINALDOCS/EVIDENCE/UI_REPLAY

      - name: Repair manuscript, transfer guide, provenance and validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          ROOT = Path.cwd()
          FINAL = ROOT / 'FINALDOCS'
          manuscript = FINAL / 'MANUSCRIPT/GRADUATION_REPORT_TRANSFER_KO_60Q.md'
          text = manuscript.read_text(encoding='utf-8')

          def sub_once(pattern: str, repl: str, value: str, label: str, flags: int = 0) -> str:
              updated, count = re.subn(pattern, repl, value, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one replacement, got {count}')
              return updated

          # Restore the figure numbering that the failed one-shot workflow intended to fix.
          text = re.sub(
              r'(?m)^\[그림 5-[0-9]+\] RAG-Cube 조건별 generation duration\.',
              '[그림 5-4] RAG-Cube 조건별 generation duration.',
              text,
          )
          text = re.sub(
              r'(?m)^\[그림 5-[0-9]+\] HyDE·CAD strata별 SCD 적용에 따른 한국어 문자 비율 변화\.',
              '[그림 5-5] HyDE·CAD strata별 SCD 적용에 따른 한국어 문자 비율 변화.',
              text,
          )
          text = re.sub(
              r'(?m)^\[그림 5-[0-9]+\] HyDE·CAD strata별 품질 지표 변화\.',
              '[그림 5-6] HyDE·CAD strata별 품질 지표 변화.',
              text,
          )

          # Make the observed language-drift problem concrete with the stored E02 input/output.
          chapter1 = text.split('# 2. 이론적 배경', maxsplit=1)[0]
          if 'E02_language_drift.png' not in chapter1:
              anchor = '셋째, 영어 문맥이 길게 제공되는 조건에서도 한국어 출력 언어를 안정적으로 유지할 필요가 있다.\n'
              if anchor not in text:
                  raise RuntimeError('chapter-1 language-drift anchor not found')
              insertion = (
                  '\n[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E02_language_drift.png | 권장폭=본문폭 95% | 정렬=가운데]\n\n'
                  '[입출력 증빙 E02] SCD OFF 조건에서 관찰된 영어 출력 이탈 사례. ext_cad_007의 저장 record는 한국어 질문, 검색된 CAD 문맥, 생성 답변과 Korean-character ratio 0.0000을 함께 보여준다.\n'
              )
              text = text.replace(anchor, anchor + insertion, 1)

          # Use direct positive wording for the HyDE retrieval-change example.
          text = text.replace(
              '검색 ID가 실제로 바뀐 저장 사례에서는 HyDE OFF 답변이 BIC 활용 정보를 찾지 못한 반면 HyDE ON 답변은 최적 cluster 수 선택을 설명했다.',
              '검색 ID가 실제로 바뀐 저장 사례에서는 HyDE OFF 답변이 GMM과 soft clustering의 일반 설명에 머물렀고, HyDE ON 답변은 BIC가 최적 cluster 수 선택에 사용된다는 근거를 포함했다.',
          )

          section57 = '''## 5.7 대표 입출력 및 요구사항별 실행 결과 [스타일=절(1.1)]

대표 입출력 분석에는 저장된 60-query generation·evaluation artifact를 읽어 재현한 E01~E06 증빙을 사용하였다. 각 증빙은 query ID와 한국어 질문, 적용 configuration, retrieved·reranked chunk ID, 최종 context, generated answer, 저장 RAGAS score와 Korean-character ratio를 한 화면에서 연결한다. 이 절의 검증 단위는 화면 구성보다 query-condition-context-output의 대응 관계와 저장 provenance다. 따라서 평균 지표가 어떤 실제 입력과 출력에서 형성되었는지를 record 수준에서 확인할 수 있다.

E01은 일반적인 정상 QA 사례다. ext_raptor_011의 H0C0S0 답변은 faithfulness 1.0000, answer relevancy 0.9365, context precision 1.0000, context recall 1.0000을 기록했고, 검색된 RAPTOR 문맥과 생성 답변을 함께 제시한다. 이 사례는 이후 요인별 사례를 읽을 때 비교 기준이 되는 저장 입출력 형식을 보여준다.

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E01_normal_qa.png | 권장폭=본문폭 95% | 정렬=가운데]

[입출력 증빙 E01] 정상 QA 저장 입출력 사례

HyDE의 retrieval-side 변화는 E04에서 직접 확인된다. ext_raptor_004는 RAPTOR의 GMM clustering에서 BIC의 역할을 묻는다. H0C0S0에서는 answer relevancy 0.0000, context recall 0.0000이었고 답변은 GMM과 soft clustering의 일반 설명에 머물렀다. H1C0S0에서는 retrieved IDs, reranked IDs와 최종 contexts가 함께 바뀌었고, 답변은 BIC가 최적 cluster 수를 결정하는 데 사용된다는 내용을 포함했다. 저장 answer relevancy는 0.8947, context recall은 1.0000이었다. 이 대응쌍은 5.4절의 HyDE 평균 answer relevancy 변화 +0.0805를 실제 검색 경로 변화와 연결한다.

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E04_hyde_retrieval_change.png | 권장폭=본문폭 95% | 정렬=가운데]

[입출력 증빙 E04] HyDE 적용에 따라 retrieval provenance와 답변이 함께 변한 사례

CAD는 검색 입력을 고정한 generation-side 비교로 확인한다. E05의 ext_raptor_001에서 CAD OFF와 ON은 retrieved IDs, reranked IDs, contexts가 모두 같다. 같은 근거를 입력으로 사용한 상태에서 faithfulness는 0.2500에서 1.0000으로, answer relevancy는 0.0000에서 0.7554로 달라졌다. 반대로 E06의 track1_0012도 동일한 검색 입력을 공유하지만 faithfulness 0.9375에서 0.5000, answer relevancy 0.9001에서 0.0000으로 변한다. 두 사례를 함께 보면 CAD의 평균값뿐 아니라 동일 문맥에서 질의별 변화 방향이 달라지는 분포를 실제 생성 문자열로 확인할 수 있다. E06 전체 화면은 부록 B에 배치한다.

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E05_cad_positive_same_context.png | 권장폭=본문폭 95% | 정렬=가운데]

[입출력 증빙 E05] 동일 검색 문맥에서 CAD ON/OFF 생성 결과가 달라진 사례

SCD의 출력 언어 제어는 E03에서 가장 직접적으로 확인된다. ext_midm_005의 H1C0S0과 H1C0S1은 retrieved IDs, reranked IDs와 contexts가 모두 같으며 SCD 상태만 다르다. 저장 답변의 Korean-character ratio는 0.0000에서 0.7713으로 증가했고, 같은 대응쌍에서 faithfulness는 0.8125에서 0.8889, answer relevancy는 0.4632에서 0.5231로 기록되었다. 이 사례는 240개 대응쌍 평균 +0.2289와 HyDE OFF 동일 문맥 120쌍 평균 +0.2182를 실제 출력 문자열의 변화와 연결한다.

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E03_scd_rescue.png | 권장폭=본문폭 95% | 정렬=가운데]

[입출력 증빙 E03] 동일 검색 문맥에서 SCD 적용 후 한국어 문자 비율이 증가한 사례

E02는 1장의 문제 정의에서 출력 언어 이탈을 보여주고, E01·E03·E04·E05는 본 절에서 정상 QA와 세 실험 요인의 관찰 사례를 연결한다. E01~E06 전체 세트와 각 화면의 원문 TXT는 부록 B의 대표 입출력 증빙에 배치한다. 이 구성은 구조·통계 그림 10개와 별도로 실제 질문, 검색 근거, 생성 답변과 평가값을 확인하기 위한 실험 증빙으로 사용한다.

'''
          text = sub_once(
              r'## 5\.7 대표 입출력 및 요구사항별 실행 결과 \[스타일=절\(1\.1\)\]\n.*?(?=## 5\.8 종합 논의)',
              section57,
              text,
              'section 5.7',
              flags=re.S,
          )

          section62 = '''## 6.2 실험 설계가 제공한 의미 [스타일=절(1.1)]

본 실험 설계의 핵심은 HyDE, CAD, SCD를 같은 RAG pipeline 안의 서로 다른 개입 지점으로 분리하고 각 요인에 맞는 비교 단위를 사용한 데 있다. HyDE 비교에서는 검색 표현이 바뀌면서 retrieved IDs와 contexts도 달라질 수 있도록 두어 retrieval-side end-to-end 효과를 관찰했다. CAD 비교에서는 retrieved IDs, reranked IDs와 contexts가 같은 대응쌍을 구성해 검색 결과의 차이를 고정하고 decoding 변화에 집중했다. SCD 비교에서는 query·HyDE·CAD 조건을 고정한 ON/OFF 대응쌍으로 출력 언어 변화를 계산했다.

이 구조는 configuration 평균과 요인별 paired contrast를 구분해 해석할 수 있게 한다. 예를 들어 H1C1S0의 높은 평균 faithfulness는 특정 조합의 기술통계이고, CAD +0.0288은 동일 문맥에서 CAD ON/OFF를 비교한 요인 수준 결과다. 두 종류의 결과를 분리함으로써 조합 선택과 개별 기법의 관찰 효과를 같은 의미로 섞지 않고 각각의 실험 단위에 맞춰 읽을 수 있다.

또한 generation record에 query, retrieved·reranked chunk ID, contexts, answer, decoding metadata와 duration을 함께 저장하여 평균 수치에서 개별 사례로 다시 내려갈 수 있는 provenance를 확보했다. 5.7절의 E01~E06은 이 저장 구조를 실제 입출력 단위에서 보여준다. 따라서 본 연구의 결과는 configuration별 평균, paired delta, 저장 검색 근거와 생성 답변을 서로 연결해 검토할 수 있는 형태로 구성된다.

'''
          text = sub_once(
              r'## 6\.2 실험 설계가 제공한 의미 \[스타일=절\(1\.1\)\]\n.*?(?=## 6\.3 적용 시 configuration 선택)',
              section62,
              text,
              'section 6.2',
              flags=re.S,
          )

          appendix_intro = '''# 부록 B. 대표 입출력 증빙 및 추가 정량 분석 [스타일=부록제목]

## B.1 저장 artifact 기반 대표 입출력 증빙 [스타일=절(1.1)]

E01~E06은 별도의 제품 기능 평가가 아니라 최종 60-query 저장 artifact에서 선택한 실제 입력·검색 근거·생성 출력의 재현 자료다. 각 PNG와 같은 이름의 `raw/*.txt`는 동일한 query ID, configuration, retrieved/reranked IDs, context, generated answer와 저장 평가값을 담는다. 구조·통계 그림 10개와 구분하기 위해 E번호를 유지하며 그림목차 번호는 부여하지 않는다.

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E01_normal_qa.png | 권장폭=본문폭 95% | 정렬=가운데]
[입출력 증빙 E01] 정상 QA 사례 — ext_raptor_011

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E02_language_drift.png | 권장폭=본문폭 95% | 정렬=가운데]
[입출력 증빙 E02] SCD OFF 출력 언어 이탈 사례 — ext_cad_007

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E03_scd_rescue.png | 권장폭=본문폭 95% | 정렬=가운데]
[입출력 증빙 E03] 동일 문맥 SCD 언어 복원 사례 — ext_midm_005

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E04_hyde_retrieval_change.png | 권장폭=본문폭 95% | 정렬=가운데]
[입출력 증빙 E04] HyDE retrieval change 사례 — ext_raptor_004

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E05_cad_positive_same_context.png | 권장폭=본문폭 95% | 정렬=가운데]
[입출력 증빙 E05] CAD 동일 문맥 양의 변화 사례 — ext_raptor_001

[입출력증빙삽입: FINALDOCS/EVIDENCE/UI_REPLAY/E06_cad_tradeoff_same_context.png | 권장폭=본문폭 95% | 정렬=가운데]
[입출력 증빙 E06] CAD 동일 문맥 trade-off 사례 — track1_0012

각 화면의 전체 텍스트는 `FINALDOCS/EVIDENCE/UI_REPLAY/raw/`에 같은 E번호로 저장한다.

## B.2 문서별·질문 유형별 추가 정량 분석 [스타일=절(1.1)]
'''
          text = sub_once(
              r'# 부록 B\. 추가 증빙 화면 \[스타일=부록제목\]\n\n# 부록 B\. 추가 정량 분석 \[스타일=부록제목\]\n',
              appendix_intro,
              text,
              'appendix B structure',
          )

          manuscript.write_text(text, encoding='utf-8')

          # HWP transfer guide: treat E01-E06 as stored experiment IO evidence.
          guide_path = FINAL / 'MANUSCRIPT/HWP_TRANSFER_GUIDE_60Q.md'
          guide = guide_path.read_text(encoding='utf-8')
          if '## 대표 입출력 증빙 삽입' not in guide:
              evidence_guide = '''## 대표 입출력 증빙 삽입

`FINALDOCS/EVIDENCE/UI_REPLAY/`의 E01~E06은 저장된 60-query artifact의 질의, retrieved/reranked IDs, context, generated answer, RAGAS와 Korean-character ratio를 읽기 쉽게 재현한 실험 입출력 자료다. `UI_REPLAY`는 기존 경로 호환을 위해 유지한 폴더명이다. HWP에서는 구조·통계 그림 10개와 구분하여 E번호를 그대로 사용하고 그림목차 번호를 부여하지 않는다.

| 위치 | PNG | 역할 |
|---|---|---|
| 1.1 | E02_language_drift.png | 한국어 질문에서 관찰된 출력 언어 이탈 문제의 실제 입출력 |
| 5.7 | E01_normal_qa.png | 정상 QA 저장 입출력 |
| 5.7 | E04_hyde_retrieval_change.png | HyDE 적용 전후 retrieval provenance와 답변 변화 |
| 5.7 | E05_cad_positive_same_context.png | 동일 문맥 CAD 생성 변화 |
| 5.7 | E03_scd_rescue.png | 동일 문맥 SCD 출력 언어 변화 |
| 부록 B | E01~E06 전체 | 대표 입출력 증빙 전체 세트 |

E06은 부록 B에만 배치한다. 각 PNG의 원문은 `FINALDOCS/EVIDENCE/UI_REPLAY/raw/<same-name>.txt`에서 확인한다.

'''
              if '## 수식' not in guide:
                  raise RuntimeError('HWP guide equation section anchor not found')
              guide = guide.replace('## 수식\n', evidence_guide + '## 수식\n', 1)
          guide_path.write_text(guide, encoding='utf-8')

          # FINALDOCS README: define the evidence semantics explicitly.
          readme_path = FINAL / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          if 'EVIDENCE/UI_REPLAY/*.png' not in readme:
              readme = readme.replace(
                  '- `FIGURES/*.png`: HWP에 삽입할 10개 구조·통계 그림\n',
                  '- `FIGURES/*.png`: HWP에 삽입할 10개 구조·통계 그림\n'
                  '- `EVIDENCE/UI_REPLAY/*.png`, `EVIDENCE/UI_REPLAY/raw/*.txt`: 저장된 60-query 질의·검색 근거·생성 답변·평가값을 재현한 대표 입출력 증빙\n',
                  1,
              )
              readme += '\n`UI_REPLAY`는 기존 경로 호환을 위해 유지한 이름이며, 이 자료의 검증 대상은 제품 화면 기능이 아니라 저장된 실험 input/retrieval/context/output의 대응 관계다.\n'
          readme_path.write_text(readme, encoding='utf-8')

          # Claim map: point representative examples at the restored IO evidence.
          claim_path = FINAL / 'VALIDATION/FINAL_CLAIM_MAP_60Q.md'
          claim = claim_path.read_text(encoding='utf-8')
          claim = claim.replace(
              '실제 응답 예시는 `FINALDOCS/DATA/evidence_manifest_60q.json`에 기록된 저장 excerpt와 provenance를 사용한다.',
              '실제 응답 예시는 `FINALDOCS/EVIDENCE/UI_REPLAY/`의 E01~E06과 같은 이름의 `raw/*.txt`를 사용하고, 각 사례의 query·config·검색 ID·context·answer는 저장 generation/evaluation artifact와 대조한다.',
          )
          claim_path.write_text(claim, encoding='utf-8')

          # Cleanup manifest: restored evidence is part of the canonical package.
          cleanup_path = FINAL / 'VALIDATION/DOCS_CLEANUP_MANIFEST.md'
          cleanup = cleanup_path.read_text(encoding='utf-8')
          if '`EVIDENCE/UI_REPLAY/`' not in cleanup:
              cleanup = cleanup.replace(
                  '- `FIGURES/`: 10 structural and statistical submission figures.\n',
                  '- `FIGURES/`: 10 structural and statistical submission figures.\n'
                  '- `EVIDENCE/UI_REPLAY/`: six stored experiment input/output evidence PNGs and matching raw text replays.\n',
                  1,
              )
              cleanup = cleanup.replace(
                  'Experiment runners and raw result artifacts\nremain in their source locations for provenance and reproducibility.\n',
                  'Experiment runners and raw result artifacts remain in their source locations for provenance and reproducibility. The E01–E06 evidence set is retained because it renders those stored experiment inputs, retrieval traces and outputs for direct inspection.\n',
                  1,
              )
          cleanup_path.write_text(cleanup, encoding='utf-8')

