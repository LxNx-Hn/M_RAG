              evidence_check = '''    if len(set(hashes)) != len(hashes):\n        raise AssertionError("duplicate structural figure content")\n\n    evidence_dir = FINAL / "EVIDENCE/UI_REPLAY"\n    evidence_cases = {\n        "E01": "E01_normal_qa",\n        "E02": "E02_language_drift",\n        "E03": "E03_scd_rescue",\n        "E04": "E04_hyde_retrieval_change",\n        "E05": "E05_cad_positive_same_context",\n        "E06": "E06_cad_tradeoff_same_context",\n    }\n    evidence_png_hashes = []\n    for case_id, stem in evidence_cases.items():\n        png = evidence_dir / f"{stem}.png"\n        raw = evidence_dir / "raw" / f"{stem}.txt"\n        need(png)\n        need(raw)\n        evidence_png_hashes.append(hashlib.sha256(png.read_bytes()).hexdigest())\n        result = subprocess.run(\n            [\n                sys.executable,\n                "-X",\n                "utf8",\n                str(FINAL.parent / "cli/evidence_replay.py"),\n                "show",\n                case_id,\n                "--figure",\n            ],\n            cwd=FINAL.parent,\n            text=True,\n            encoding="utf-8",\n            errors="strict",\n            capture_output=True,\n            check=False,\n        )\n        if result.returncode:\n            raise AssertionError(f"fresh evidence replay failed for {case_id}: {result.stderr}")\n        if result.stdout.replace("\\r\\n", "\\n") != raw.read_text(encoding="utf-8").replace("\\r\\n", "\\n"):\n            raise AssertionError(f"fresh evidence replay mismatch for {case_id}")\n    if len(set(evidence_png_hashes)) != 6:\n        raise AssertionError("duplicate stored IO evidence PNG content")\n\n    chapter1 = text.split("# 2. 이론적 배경", maxsplit=1)[0]\n    chapter5 = text.split("# 5. 실험", maxsplit=1)[1].split("# 6. 결론", maxsplit=1)[0]\n    appendix_b = text.split("# 부록 B.", maxsplit=1)[1].split("# 부록 C.", maxsplit=1)[0]\n    if "E02_language_drift.png" not in chapter1:\n        raise AssertionError("E02 language-drift IO evidence is missing from chapter 1")\n    for required_case in ("E01_normal_qa.png", "E03_scd_rescue.png", "E04_hyde_retrieval_change.png", "E05_cad_positive_same_context.png"):\n        if required_case not in chapter5:\n            raise AssertionError(f"chapter 5.7 is missing stored IO evidence: {required_case}")\n    if "E06_cad_tradeoff_same_context.png" in chapter5:\n        raise AssertionError("E06 trade-off evidence must remain appendix-only")\n    for stem in evidence_cases.values():\n        if f"{stem}.png" not in appendix_b:\n            raise AssertionError(f"appendix B is missing stored IO evidence: {stem}")\n'''
              if evidence_anchor not in validator:
