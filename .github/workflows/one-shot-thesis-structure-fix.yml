name: One-shot thesis structure fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-thesis-structure-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix manuscript and provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          manuscript = Path('FINALDOCS/MANUSCRIPT/GRADUATION_REPORT_TRANSFER_KO_60Q.md')
          text = manuscript.read_text(encoding='utf-8')

          text = re.sub(
              r'(?m)^\[그림 5-[0-9]+\] RAG-Cube 조건별 generation duration\.',
              '[그림 5-4] RAG-Cube 조건별 generation duration.',
              text,
          )
          text = re.sub(
              r'(?m)^\[그림 5-[0-9]+\] HyDE·CAD strata별 SCD 적용에 따른 한국어 문자 비율 변화\.',
              '[그림 5-5] HyDE·CAD strata별 SCD 적용에 따른 한국어 문자 비율 변화.',
              text,
          )
          text = re.sub(
              r'(?m)^\[그림 5-[0-9]+\] HyDE·CAD strata별 품질 지표 변화\.',
              '[그림 5-6] HyDE·CAD strata별 품질 지표 변화.',
              text,
          )
          text = text.replace('# 부록 B. 추가 증빙 화면 [스타일=부록제목]\n\n', '')

          section57 = (
              '## 5.7 대표 입출력 및 요구사항별 실행 결과 [스타일=절(1.1)]\n\n'
              '대표 입출력 분석은 저장된 generation·evaluation artifact의 query ID, 검색 문맥, 생성 답변과 평가 점수를 직접 대조하는 방식으로 수행하였다. HyDE는 retrieved ID와 final context가 달라진 대응쌍에서 검색 표현 변화와 답변 변화를 연결해 확인하였다. CAD는 retrieved IDs, reranked IDs와 contexts가 같은 대응쌍에서 decoding 조건에 따른 답변 차이를 비교하였다. SCD는 동일 query·HyDE·CAD 조건의 ON/OFF 대응쌍에서 Korean-character ratio와 생성 문자열 변화를 분석하였다.\n\n'
              '이 절의 질의 단위 분석은 5.4~5.6절의 평균 결과를 각 record의 입력, 검색 문맥, 생성 답변과 평가 점수에 연결한다. HyDE는 retrieval provenance와 answer relevancy 변화를, CAD는 same-context 조건과 faithfulness·answer relevancy 변화를, SCD는 language-adherence 변화와 실제 생성 문자열을 중심으로 정리하였다.\n\n'
          )
          text = re.sub(
              r'## 5\.7 대표 입출력 및 요구사항별 실행 결과 \[스타일=절\(1\.1\)\]\n.*?(?=## 5\.8 종합 논의)',
              section57,
              text,
              flags=re.S,
          )
          manuscript.write_text(text, encoding='utf-8')

          manifest_path = Path('FINALDOCS/DATA/evidence_manifest_60q.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for relative_path in list(manifest['sources']):
              source = Path(relative_path.replace('\\', '/'))
              if not source.is_file():
                  raise FileNotFoundError(f'missing manifest source: {source}')
              manifest['sources'][relative_path] = hashlib.sha256(source.read_bytes()).hexdigest()
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py
          rm -f .github/workflows/one-shot-thesis-structure-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINALDOCS .github/workflows/one-shot-thesis-structure-fix.yml
          git diff --cached --check
          git commit -m 'docs(thesis): finalize manuscript after UI removal'
          git push origin HEAD:main
