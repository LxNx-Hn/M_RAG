## 입출력 증빙 계약

E01~E06은 제품 UI 구현 여부를 평가하는 자료가 아니라 저장된 60-query 실험의 실제 입력·검색 근거·생성 출력을 확인하는 증빙이다. 각 raw TXT는 현재 repository의 generation/evaluation artifact를 `cli/evidence_replay.py show E0X --figure`로 다시 읽은 출력과 byte-for-text 수준으로 대조한다. PNG 6개는 이 raw 내용을 HWP에서 읽기 쉽게 표시하는 고정 증빙이며, 구조·통계 그림 10개와 별도 E번호를 사용한다.

E02는 1장의 출력 언어 이탈 문제 정의에, E01·E03·E04·E05는 5.7의 대표 입출력 분석에 연결한다. E06은 CAD 동일 문맥 trade-off의 보조 사례로 부록 B에 배치한다. 부록 B에는 E01~E06 전체와 raw TXT 경로를 함께 기록한다.

## 원자료 및 수치 대조

source manifest의 generation·evaluation·analysis artifact를 현재 bytes로 다시 SHA-256 계산한다. 최종 기준은 60 질의-대상문서 쌍, 8 configuration, 480 generation record, HyDE primary 60쌍, CAD 동일 문맥 primary 60쌍, SCD ON/OFF 240쌍이다. CAD faithfulness는 양쪽 score가 존재하는 58 완결쌍을 사용한다.

핵심값은 HyDE answer relevancy +0.0805 [95% CI +0.0110, +0.1514], CAD faithfulness +0.0288 [95% CI -0.0367, +0.0934] (n=58), SCD 전체 +0.2289 [95% CI +0.2051, +0.2532] (n=240), HyDE OFF 동일 문맥 SCD +0.2182 [95% CI +0.1880, +0.2487] (n=120)이다.

## 구조 점검

원고의 5.7은 E01~E06을 이용한 실제 record-level 분석으로 구성하고, 6.2는 HyDE retrieval-side, CAD same-context generation-side, SCD output-language control을 분리한 실험 설계의 의미를 설명한다. 5장 구조·통계 그림 번호는 5-1부터 5-6까지 그림목차와 일치한다. 구조·통계 그림은 총 10개이며 입출력 증빙 E01~E06은 그림목차 번호에서 분리한다.

