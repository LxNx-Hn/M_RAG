name: Restore thesis stored IO evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-thesis-structure-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair package
        run: python -X utf8 cli/fix_thesis_io_evidence.py
      - name: Validate and capture diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py > FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt 2>&1
          rc=$?
          cat FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate diff
        run: git diff --check
      - name: Commit repaired package and diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINALDOCS cli/fix_thesis_io_evidence.py
          git commit -m 'docs(thesis): restore stored input-output evidence'
          git push origin HEAD:main
      - name: Fail if validator failed
        if: steps.validate.outputs.rc != '0'
        run: exit 1
