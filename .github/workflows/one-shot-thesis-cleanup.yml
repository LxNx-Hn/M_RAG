              'HyDE 적용 시 answer relevancy는 +0.0805의 양의 평균 변화를 보였고, faithfulness와 context precision, context recall은 서로 다른 방향의 변화를 보였다.',

              '이 사례는 평균의 원인을 일반화하는 증거가 아니라, retrieval change와 answer-level 결과를 함께 확인하는 provenance 사례다.':
              '저장 사례에서는 retrieval change와 answer-level 결과의 연결을 query 단위로 확인할 수 있었다.',

              'answer relevancy의 양의 변화와 context precision의 음의 변화가 함께 나타난 이유는 하나의 수치만으로 확정할 수 없다. 가능한 해석은 HyDE가 질문을 설명하는 문서형 검색 표현을 제공하면서 최종 답변이 질문의 요구에 더 직접 반응하도록 도왔지만, reranked 상위 문맥의 관련성 구성은 일부 질의에서 달라졌다는 것이다. 즉 answer-level 결과가 좋아졌다고 해서 선택된 문맥 목록의 모든 항목이 더 정밀해졌다고 볼 수는 없다. HyDE ON은 dense query representation, fusion 후보, reranking 이후의 context selection까지 바꾸므로, +0.0805는 특정 검색 모듈 하나의 순위 개선이 아니라 이 고정 pipeline을 통과한 답변의 대응 차이로만 읽어야 한다.':
              'answer relevancy의 양의 변화와 context precision의 음의 변화는 HyDE가 질문을 문서형 검색 표현으로 확장하면서 최종 답변 적합성과 상위 문맥 구성이 서로 다른 방향으로 변할 수 있음을 보여준다. HyDE ON은 dense query representation, fusion 후보, reranking 이후의 context selection까지 변화시키므로 +0.0805는 고정 pipeline 전체를 거친 answer-level 대응 차이로 해석한다.',

