              'strata별 평균은 각 configuration에서 관찰된 SCD language-adherence 변화의 descriptive pattern을 요약한다.',

              'E03의 same-context rescue 화면은 이 해석 범위를 시각적으로 보완한다. 해당 pair에서는 query·검색 ID·rerank ID·contexts를 고정한 뒤 SCD OFF/ON 답변의 표면 언어 차이를 보여 준다. 따라서 화면은 SCD의 직접 작동 목표와 연결되지만, 한 사례의 문장 품질이 240개 질의 전체의 자연스러움이나 정확성을 대표하지는 않는다. 출력 언어가 중요한 실제 서비스에서는 ratio와 함께 고유명사 보존, 인용 표기, 문장 흐름을 사람 검토로 확인해야 하며, 본 실험은 그 후속 검증의 필요성을 없애지 않는다.':
              'same-context 대응쌍에서는 query·검색 ID·rerank ID·contexts를 고정한 상태에서 SCD OFF/ON 답변의 표면 언어 차이를 비교하였다. Korean-character ratio와 함께 고유명사, 인용 표기, 기술 용어의 유지 양상을 확인할 수 있다.',

              '정상 QA 사례는 저장된 query ID `ext_raptor_011`에서 H0C0S0 답변과 RAGAS score를 재현한다. HyDE 사례는 `ext_raptor_004`, SCD 언어 사례는 UI selector가 동일 input rescue 조건으로 선택한 record, CAD 사례는 input identity를 assertion으로 확인한 selected pair를 사용한다. 그림의 answer text는 저장 record를 새로 작성하지 않고 display-only truncation 표시만 사용한다. 전체 UI replay 원문은 `FINALDOCS/EVIDENCE/UI_REPLAY/raw/`에 보존한다.':
              '대표 입출력 분석은 저장된 query ID와 generation·evaluation artifact를 직접 대조하여 수행한다. HyDE는 retrieval ID 변화가 확인되는 대응쌍, CAD는 동일 context 대응쌍, SCD는 동일 query·HyDE·CAD 조건의 ON/OFF 대응쌍을 기준으로 결과를 비교한다.',

              '따라서 HyDE는 본 corpus에서 질문 관련성 측면의 양의 결과가 가장 명확했지만, 모든 retrieval·answer metric이 함께 개선되었다고 말할 수는 없다. E04 사례는 이러한 결과가 실제 retrieved ID 변화까지 포함한 end-to-end 효과임을 보여준다.':
              'HyDE는 본 corpus에서 answer relevancy의 양의 변화가 가장 명확했고, faithfulness·context precision·context recall은 지표별로 서로 다른 변화를 보였다. 저장된 retrieved ID 변화는 이 결과가 end-to-end 검색 경로 변화를 포함함을 보여준다.',

              '그러나 이 비율은 언어 성향을 측정하는 값이므로 faithfulness나 문장 자연스러움의 향상으로 확대 해석하지 않는다.':
              'Korean-character ratio는 출력 언어 성향의 변화를 나타내며, SCD의 직접 목표인 한국어 출력 유지 정도를 정량화한다.',

              'configuration maximum을 읽을 때에는 두 종류의 비교를 섞지 않아야 한다.':
              'configuration maximum과 paired contrast는 서로 다른 분석 단위를 제공한다.',

