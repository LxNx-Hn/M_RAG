name: One-shot thesis cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-thesis-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clean thesis prose and remove UI material
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          manuscript = root / 'FINALDOCS/MANUSCRIPT/GRADUATION_REPORT_TRANSFER_KO_60Q.md'
          text = manuscript.read_text(encoding='utf-8')

          # 1) Remove service/evidence-UI figures from the thesis itself.
          text = re.sub(r'(?m)^\[그림\s+1-2\].*evidence replay.*\n?', '', text, flags=re.I)
          text = re.sub(r'(?m)^\[그림\s+1-2\].*저장 언어 이탈 사례.*\n?', '', text)
          text = re.sub(r'(?m)^\[그림\s+5-(?:4|5|8|9)\].*evidence replay.*\n?', '', text, flags=re.I)
          text = re.sub(r'(?m)^\[그림삽입:\s*FINALDOCS/EVIDENCE/UI_REPLAY/[^\n]+\]\n?', '', text)
          text = re.sub(r'(?m)^\[그림\s+(?:1-2|5-4|5-5|5-8|5-9)\][^\n]*\n?', '', text)

          # Remove the old UI appendix wholesale; remaining appendices are renumbered below.
          text = re.sub(
              r'\n# 부록 B\. 추가 UI evidence \[스타일=부록제목\].*?(?=\n# 부록 C\.)',
              '\n', text, flags=re.S
          )

          # 2) Rewrite defensive/negative prose into direct factual prose.
          replacements = {
              '그림 1-2는 언어 이탈을 단순한 번역 불편이 아니라 RAG 출력 단계에서 확인해야 할 연구 문제로 보여 준다. 화면의 답변은 새로 생성한 예시가 아니라 저장된 record를 read-only로 재현한 것이며, 한 사례만으로 전체 효과를 주장하지 않는다. 다만 한국어 질의와 영어 근거가 함께 주어졌을 때 출력의 표면 언어가 사용자의 질의 언어와 달라질 수 있음을 구체적으로 확인하게 한다. 따라서 이후 SCD 분석에서는 답변이 한국어로 보이는지와 답변 내용이 근거에 충실한지를 별개의 축으로 측정한다.':
              '저장 결과에서는 한국어 질의와 영어 근거가 함께 주어졌을 때 최종 답변의 표면 언어가 영어 또는 혼합 언어로 이동하는 사례가 확인되었다. 이에 따라 SCD 분석에서는 출력 언어 성향과 답변의 근거 충실도를 별개의 평가 축으로 측정한다.',

              '본 보고서는 이 실험 프로그램과 저장 결과를 연구 범위로 둔다. 저장소의 서비스 화면, API route, 배포 상태와 사용자 경험은 실험 변수로 다루지 않는다. 본문에 제시하는 evidence replay UI는 새로운 답변을 생성하는 서비스 화면이 아니라, 저장된 query·context·answer·score를 read-only로 확인하는 증빙 인터페이스다. 또한 현재 결과를 다른 학문 분야나 다른 생성 모델에 그대로 일반화하지 않는다.':
              '본 연구의 분석 범위는 네 영어 학술·기술 문서, 60개 한국어 질의-대상문서 쌍, 여덟 RAG-Cube configuration에서 생성된 480개 generation record와 대응 평가 결과로 구성된다.',

              '평균값, 입력 provenance, 실제 응답 중 하나만으로 결론을 내리지 않는 것이 본 연구의 분석 원칙이다.':
              '본 연구는 대응 평균과 신뢰구간, 입력 provenance, 실제 응답을 함께 사용해 결과를 해석한다.',

              '따라서 검색 결과가 존재한다는 사실만으로 답변이 문서에 충실하다고 가정하지 않는다.':
              '검색 단계와 생성 단계의 품질은 context-level 지표와 answer-level 지표로 각각 평가한다.',

              '두 경로의 점수 척도는 직접 합치지 않고 rank 기반 weighted Reciprocal Rank Fusion으로 결합하며[7], 후보는 CrossEncoder가 질의와 passage를 함께 보며 다시 정렬한다[8].':
              '두 경로는 rank 기반 weighted Reciprocal Rank Fusion으로 통합하며[7], 이후 CrossEncoder가 질의와 passage를 함께 평가해 후보 순서를 재정렬한다[8].',

              'HyDE ON/OFF에서 retrieved ID나 final context가 달라지면 검색 표현 변경의 결과로 해석하고, CAD 비교에서는 IDs와 contexts의 동일성을 먼저 확인해 retrieval 변화가 섞이지 않도록 한다.':
              'HyDE ON/OFF는 검색 표현 변경에 따른 retrieved ID와 final context 변화를 함께 분석하고, CAD 비교는 IDs와 contexts가 동일한 대응쌍으로 구성한다.',

              '그러므로 HyDE의 차이를 읽을 때에는 dense retrieval만의 개선으로 단정하지 않고, fusion과 reranking을 거친 최종 문맥이 질문에 어떤 근거를 제공했는지를 확인해야 한다.':
              '따라서 HyDE 효과는 dense retrieval, fusion, reranking을 거쳐 형성된 최종 문맥과 answer-level 결과를 함께 분석한다.',

              '재정렬은 후보 passage의 순서를 바꾸는 마지막 검색 단계이지만, 생성 단계의 품질을 직접 보장하지는 않는다.':
              '재정렬은 후보 passage의 순서를 조정하며, 생성 단계에서는 선택된 문맥을 바탕으로 별도의 answer-level 품질이 결정된다.',

              '같은 hybrid backbone을 모든 조건에 적용한 것은 검색기의 일반 성능을 경쟁시키기 위해서가 아니라, 검색 단계의 변화와 decoding 단계의 변화를 서로 다른 해석 단위로 남기기 위해서다.':
              '동일한 hybrid backbone을 모든 조건에 적용하여 검색 단계의 변화와 decoding 단계의 변화를 서로 다른 해석 단위로 구분하였다.',

              '이 hypothetical document는 실제 논문의 근거나 정답으로 사용하지 않으며, 최종 답변은 검색된 문서 passage를 바탕으로 생성한다.':
              'hypothetical document는 dense retrieval용 검색 표현으로 사용하고, 최종 답변은 검색된 문서 passage를 근거로 생성한다.',

              '이 구분은 교차언어 환경에서 HyDE의 장점과 위험을 동시에 설명한다. 가상 문서는 질문을 영어 학술문서에 가까운 서술로 확장할 수 있지만, 그 문서가 자체적으로 사실 근거가 되는 것은 아니다. 가상 문서에 포함된 표현이 검색 공간에서 유용한 후보를 끌어올릴 수도 있고, 반대로 특정 세부사항을 과도하게 강조해 다른 후보를 밀어낼 수도 있다. 따라서 본 연구에서 answer relevancy의 변화는 가상 문서의 정답성을 증명하는 결과가 아니라, 그것을 거친 검색 경로가 최종 답변의 질문 적합성과 어떤 관계를 보였는지에 관한 관찰이다. 이 경계를 유지해야 HyDE를 영어 논문에 대한 한국어 질문의 일반적 품질 보장으로 확대 해석하지 않을 수 있다.':
              '교차언어 환경에서 hypothetical document는 한국어 질문을 영어 학술문서에 가까운 검색 표현으로 확장한다. 이 표현 변화는 dense retrieval 후보와 이후 fusion·reranking 결과에 영향을 줄 수 있다. 본 연구는 이러한 검색 경로 변화가 최종 answer relevancy와 어떤 관계를 보이는지 대응 비교로 분석한다.',

              'CAD는 검색 후보를 다시 선택하는 기법이 아니므로, 독립적인 decoding 효과를 보기 위해 CAD ON/OFF에서 retrieved IDs, reranked IDs와 contexts가 동일한지를 확인한다.':
              'CAD의 decoding 효과는 retrieved IDs, reranked IDs와 contexts가 동일한 ON/OFF 대응쌍에서 분석한다.',

              '문맥 의존성을 강화한다고 해서 모든 질문에서 관련성이나 충실도가 동시에 높아진다고 가정하지 않으며, 동일 입력에서 나타나는 질의별 차이도 결과의 일부로 해석한다.':
              '동일 입력에서 나타나는 질의별 관련성과 충실도 차이를 CAD의 generation-side 결과로 분석한다.',

              '다만 동일 입력이라는 조건은 문맥 자체가 충분하고 정확하다는 보증이 아니므로, CAD의 결과는 근거 선택의 품질과 분리된 제한적 generation-side 관찰이다.':
              'CAD 결과는 동일 검색 문맥을 전제로 한 generation-side 변화로 해석한다.',

              '이 값은 출력 언어 성향을 직접 계산하는 지표일 뿐 문법성, 내용 정확성, 전문용어 사용의 적절성을 대신하지 않는다. 따라서 SCD의 직접 결과는 language adherence로 한정해 해석한다.':
              'Korean-character ratio는 출력 언어 성향을 측정하는 지표이며, SCD의 language adherence 변화를 정량화하는 데 사용한다.',

              'SCD는 답변의 의미 내용을 다시 검색하거나 수정하는 기법이 아니라, 생성 후보 가운데 어떤 언어 표면을 더 쉽게 선택하게 할지 조절한다.':
              'SCD는 decoding 중 token score를 조절하여 목표 언어 표면의 선택 확률을 변화시킨다.',

              '비율이 높아졌다는 관찰은 영어 근거의 영향 아래에서도 한국어 문자 사용이 늘었다는 뜻이지만, 번역 충실도·문장 자연스러움·전문 용어의 적절성까지 자동으로 확인한 것은 아니다. 특히 논문 제목, 모델명, 데이터셋명처럼 영어 표기가 적절한 부분까지 모두 한국어로 바꾸는 것이 좋은 출력이라는 뜻도 아니다. 본 연구는 이를 hard language restriction의 성능이 아니라 language adherence의 한 operational indicator로 한정한다.':
              'Korean-character ratio의 증가는 영어 근거가 포함된 응답에서 한국어 문자 사용이 증가했음을 의미한다. 논문 제목, 모델명, 데이터셋명과 같은 영어 고유 표기는 유지될 수 있으므로 이 지표는 language adherence의 operational indicator로 사용한다.',

              '서로 다른 층위를 측정하므로 네 값을 하나의 종합점수로 합치지 않는다.':
              '네 지표는 서로 다른 품질 층위를 측정하므로 각각 독립적으로 분석한다.',

              '자동 평가 과정에서 score가 생성되지 않은 경우에는 임의의 값으로 대체하지 않고 유효한 대응쌍만 사용한다.':
              '자동 평가에서는 score가 존재하는 유효 대응쌍을 기준으로 분석한다.',

              'SCD의 직접 목표는 일반 품질이 아니라 출력 언어 유지이므로, RAGAS와 별도로 Korean-character ratio를 계산한다.':
              'SCD의 출력 언어 유지 효과는 RAGAS와 별도로 Korean-character ratio를 계산해 평가한다.',

              '본 연구는 이 방법들을 새로 제안하거나 모두 구현해 비교하는 연구가 아니다. HyDE, CAD, SCD를 각각 검색 표현, 문맥 기반 생성, 출력 언어 제어 요인으로 고정 backbone 안에 배치하고, 각 요인의 적용 위치에 맞는 통제 비교를 수행하는 application study다.':
              '본 연구는 HyDE, CAD, SCD를 각각 검색 표현, 문맥 기반 생성, 출력 언어 제어 요인으로 고정 backbone 안에 배치하고, 각 요인의 적용 위치에 맞는 통제 비교를 수행하는 application study다.',

              '표 2-1의 비교는 관련 연구의 성능 순위를 다시 만드는 표가 아니라, 본 연구가 각 선행 흐름을 어느 위치에서 참조하는지를 밝히는 장치다.':
              '표 2-1은 각 관련 연구가 본 실험의 검색, 생성, 평가 설계와 연결되는 지점을 정리한다.',

              '본 연구는 이 방법들의 완전한 대체나 직접 우열 비교가 아니라, 한국어 질의-영어 문서 환경에서 이미 알려진 세 개입 지점이 한 fixed backbone 안에서 어떤 trade-off를 보이는지 기록한다. 따라서 표의 마지막 열에 적은 해석 제한은 부수적 주석이 아니라 각 결과가 주장할 수 있는 범위를 정하는 핵심 조건이다.':
              '본 연구는 한국어 질의-영어 문서 환경에서 HyDE, CAD, SCD의 세 개입 지점이 fixed backbone 안에서 보이는 trade-off를 기록한다. 표의 마지막 열은 각 선행 연구가 본 실험 설계와 연결되는 위치를 요약한다.',

              '설계의 중심은 서비스 기능의 수가 아니라 실험 변인의 통제와 결과 추적 가능성이다.':
              '시스템 설계는 실험 변인의 통제와 결과 추적 가능성을 중심으로 구성하였다.',

              '이름만으로 실행 상태를 추정하지 않고 parameter field와 함께 대조한다.':
              'configuration 이름과 parameter field를 함께 대조하여 실행 상태를 확인한다.',

              'Evidence replay UI는 새로운 inference를 수행하지 않고 저장 artifact만 읽는다. normal QA, HyDE retrieval change, CAD same-context pair, SCD language rescue 등은 query/config selector와 input-identity 조건으로 선택한다. 화면에서 answer를 다시 쓰지 않으며, source path와 record key를 통해 원본으로 돌아갈 수 있게 한다. 따라서 UI는 통계 결과를 대신하는 것이 아니라, 특정 비교가 실제 stored input/output에서 어떻게 나타나는지 확인하는 보조 증거다.':
              '',

              '환경 표에는 실제 record에서 확인 가능한 설정만 기록하며 장비 사양이나 서비스 운영 상태처럼 결과 artifact에서 확인할 수 없는 정보는 추가하지 않는다.':
              '환경 표는 generation record와 실험 설정에서 확인한 generation model, retrieval backend, context count, decoding parameter를 정리한다.',

              '저장부는 answer뿐 아니라 검색 ID, contexts, parameter와 duration을 함께 기록해 이후 분석이 모델을 다시 실행하지 않고도 비교 조건을 확인할 수 있게 한다.':
              '저장부는 answer, 검색 ID, contexts, parameter와 duration을 함께 기록하여 이후 분석에서 비교 조건을 직접 대조할 수 있게 한다.',

              'HyDE의 hypothetical document는 생성 답변의 근거로 사용하지 않고 dense retrieval 입력으로만 사용한다.':
              'HyDE의 hypothetical document는 dense retrieval 입력으로 사용한다.',

              'SCD는 사후 번역이 아니라 생성 중 token score를 조정하는 processor이므로, Korean-character ratio는 저장된 answer 문자열에서 다시 계산할 수 있다.':
              'SCD는 생성 중 token score를 조정하며, Korean-character ratio는 저장된 answer 문자열에서 계산한다.',

              '최종 evidence replay도 같은 저장 파일을 읽으며 answer와 score를 수정하지 않는다. 이 구조를 통해 본문 수치와 실제 사례가 동일한 source artifact에 연결된다.':
              '분석 결과는 동일한 generation·evaluation artifact에서 계산되며, 본문 수치와 원자료의 연결을 유지한다.',

              '전체 1,920 metric cell 중 5개 faithfulness 값은 빈 명제 집합으로 인해 결측이며, 이를 0이나 다른 값으로 대체하지 않는다.':
              '전체 1,920 metric cell 중 5개 faithfulness 값은 빈 명제 집합으로 인해 결측이며, faithfulness 분석은 유효값이 존재하는 대응쌍을 기준으로 수행한다.',

              '60개 질의는 네 문서에 15개씩 배정되며 각 질의에는 source page와 answer span이 보존되어 있다. 문서별 균등 배정은 한 문서의 특성이 전체 평균을 과도하게 지배하는 것을 줄이기 위한 표본 내 설계다. 다만 네 문서가 모든 학술 분야를 대표하는 것은 아니므로 외적 대표성을 보장하는 표본추출로 해석하지 않는다.':
              '60개 질의는 네 문서에 15개씩 균등 배정하며 각 질의에 source page와 answer span을 연결하였다. 이 구성은 네 대상 문서 사이의 표본 균형을 유지하는 실험 설계다.',

