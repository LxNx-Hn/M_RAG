              '',

              '이 수치는 faithfulness나 answer relevancy 같은 일반 RAG 품질 지표의 변화를 뜻하지 않으며, 문자 비율이 문법성·근거 정확성·전문용어 선택을 모두 대체하는 지표도 아니다.':
