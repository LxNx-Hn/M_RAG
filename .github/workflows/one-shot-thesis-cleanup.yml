              '따라서 지표별 최고값과 요인별 대응 차이를 함께 보면 configuration별 trade-off를 구분할 수 있다.',

              '따라서 어느 문서 또는 유형에서 특정 요인이 유리해 보이는 결과가 있더라도 이를 확정적 효과로 쓰지 않고, 후속 실험에서 검증할 가설로만 남긴다.':
              '문서별·질문유형별 결과는 후속 실험에서 검증할 가설을 도출하는 탐색 분석으로 사용한다.',

              'HyDE 비교에는 한국어 질의의 reformulation과 hypothetical document 생성이 함께 포함되므로 각 단계의 독립 기여는 분리하지 않았다.':
              'HyDE 비교는 한국어 질의 reformulation과 hypothetical document 생성을 함께 포함하는 end-to-end 조건으로 구성하였다.',

              '다만 faithfulness, context precision, context recall은 같은 방향으로 움직이지 않았으므로, 이 답은 한국어 질의가 영어 학술문서 표현에 연결되는 해당 pipeline의 질문 적합성에 관한 답이다.':
              'faithfulness, context precision, context recall은 지표별로 서로 다른 방향을 보였으며, HyDE의 가장 뚜렷한 변화는 해당 pipeline의 answer relevancy에서 관찰되었다.',

              '따라서 CAD는 모든 답변의 품질을 높이는 일반 규칙이 아니라, 고정 근거를 생성에 반영하는 방식과 시간 비용을 함께 조정하는 generation-side 요인으로 해석한다.':
              'CAD는 고정 근거를 생성에 반영하는 방식과 generation duration을 함께 변화시키는 generation-side 요인으로 해석한다.',

              '이는 한국어 출력 유지라는 직접 목표에서 안정적인 관찰이지만, 의미 정확성이나 자연스러움의 일반적 개선을 뜻하지 않는다.':
              '이는 한국어 출력 유지라는 직접 목표에서 안정적인 변화를 보여준다.',

              '따라서 본 연구의 최종 답은 하나의 최적 조합을 선택하는 것이 아니라, 검색 관련성, 근거 반영, 출력 언어, 허용 지연 가운데 무엇을 우선할지 먼저 정한 뒤 대응 지표와 사례를 함께 확인해야 한다는 것이다.':
              '본 연구의 최종 결과는 검색 관련성, 근거 반영, 출력 언어, 허용 지연의 우선순위에 따라 configuration 선택 기준이 달라짐을 보여준다.',

              '본 연구의 설계적 의미는 세 기존 기법을 새 방법으로 제안했다는 데 있지 않다. 각 기법의 pipeline position에 맞춰 서로 다른 비교 계약을 사용했다는 데 있다.':
              '본 연구의 설계적 의미는 HyDE, CAD, SCD의 pipeline position에 맞춰 서로 다른 비교 계약을 적용한 데 있다.',

              '이 분리는 평균 수치의 원인 범위를 과장하지 않게 하며, 어느 결과가 검색 근거의 변화와 연결되고 어느 결과가 decoding 변화와 연결되는지 재검토할 수 있게 한다. 저장 record와 evidence replay UI를 함께 남긴 것은 통계 표만으로 보이지 않는 실제 입력·출력의 연결을 확인하기 위한 것이다.':
              '이 분리는 검색 근거 변화와 decoding 변화의 영향을 구분하고, 저장 record의 query·context·answer·score를 통해 각 대응 비교의 입력과 결과를 추적할 수 있게 한다.',

              '실제 한국어 질의-영어 문서 RAG에 이 결과를 적용할 때에는 configuration을 고정된 권장값으로 복사하지 않는다.':
              '실제 한국어 질의-영어 문서 RAG에서는 목표 지표에 따라 configuration을 선택할 수 있다.',

              '이 순서는 본 corpus의 결과를 다른 서비스에 일반화하는 결론이 아니라, 후속 환경에서 무엇을 다시 측정해야 하는지 정하는 실험 설계 기준이다.':
              '이 선택 순서는 후속 환경에서 우선 측정할 retrieval, generation, language 지표를 정하는 실험 설계 기준으로 활용할 수 있다.',

              '이러한 제한은 현재 결과를 무효화하는 사후 조건이 아니라, 저장된 60-query evidence가 어디까지 답하고 어디부터 새 검증이 필요한지를 명확히 하는 연구 경계다.':
              '후속 검증은 현재 60-query 결과의 적용 범위를 확장하고 외적 타당성을 평가하는 단계로 이어진다.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # Remove any remaining thesis-body wording that frames service/UI material as research evidence.
          text = re.sub(r'(?im)^.*(?:evidence replay|UI_REPLAY|서비스 화면|서비스 UI|API route|배포 상태|사용자 경험).*$\n?', '', text)
          text = re.sub(r'(?m)^\s*\n{3,}', '\n\n', text)

          # Renumber structural figures after removing UI screenshots.
          fig_repls = {
              '[그림 5-6] RAG-Cube 조건별 생성 시간': '[그림 5-4] RAG-Cube 조건별 생성 시간',
              '[그림 5-7] SCD의 한국어 문자 비율 변화': '[그림 5-5] SCD의 한국어 문자 비율 변화',
              '[그림 5-10] HyDE·CAD strata별 품질 지표 변화': '[그림 5-6] HyDE·CAD strata별 품질 지표 변화',
          }
          for old, new in fig_repls.items():
              text = text.replace(old, new)

          # Renumber appendices after dropping the UI appendix.
          text = text.replace('부록 A~E', '부록 A~D')
          text = text.replace('부록 C', '__APP_B__').replace('부록 D', '__APP_C__').replace('부록 E', '__APP_D__')
          text = text.replace('__APP_B__', '부록 B').replace('__APP_C__', '부록 C').replace('__APP_D__', '부록 D')
          text = text.replace('[표 C-', '__TB_B__').replace('[표 D-', '__TB_C__').replace('[표 E-', '__TB_D__')
          text = text.replace('__TB_B__', '[표 B-').replace('__TB_C__', '[표 C-').replace('__TB_D__', '[표 D-')

          manuscript.write_text(text, encoding='utf-8')

          # 3) Clean HWP transfer guide: no service/UI evidence material.
          guide_p = root / 'FINALDOCS/MANUSCRIPT/HWP_TRANSFER_GUIDE_60Q.md'
          guide = guide_p.read_text(encoding='utf-8')
          guide = re.sub(r'(?im)^.*(?:EVIDENCE/UI_REPLAY|evidence replay|UI evidence|E0[1-6]|서비스 화면|서비스 UI|API route|배포 상태|사용자 경험).*$\n?', '', guide)
          guide = guide.replace('부록 A~E', '부록 A~D')
          guide_p.write_text(re.sub(r'\n{3,}', '\n\n', guide), encoding='utf-8')

          # 4) Clean staging HTML so it cannot re-introduce removed prose/UI screenshots.
          html_p = root / 'FINALDOCS/MANUSCRIPT/HWP_WEB_TRANSFER_60Q.html'
          if html_p.exists():
              html = html_p.read_text(encoding='utf-8')
              html = re.sub(r'<(?:p|li|tr)[^>]*>.*?(?:evidence replay|UI_REPLAY|서비스 화면|서비스 UI|API route|배포 상태|사용자 경험).*?</(?:p|li|tr)>', '', html, flags=re.I|re.S)
              html = re.sub(r'<img[^>]+(?:UI_REPLAY|E0[1-6]_)[^>]*>', '', html, flags=re.I)
              html = html.replace('부록 A~E', '부록 A~D')
              html_p.write_text(html, encoding='utf-8')

          # 5) Final-package README/validation prose should not instruct HWP insertion of UI evidence.
          for rel in [
              'FINALDOCS/README.md',
              'FINALDOCS/VALIDATION/FINAL_VALIDATION_REPORT_60Q.md',
              'FINALDOCS/VALIDATION/FINAL_CLAIM_MAP_60Q.md',
              'FINALDOCS/VALIDATION/DOCS_CLEANUP_MANIFEST.md',
          ]:
              p = root / rel
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'(?im)^.*(?:EVIDENCE/UI_REPLAY|evidence replay|UI evidence|E0[1-6]|서비스 화면|서비스 UI|API route|배포 상태|사용자 경험).*$\n?', '', s)
              s = s.replace('부록 A~E', '부록 A~D')
              p.write_text(re.sub(r'\n{3,}', '\n\n', s), encoding='utf-8')

          # 6) Update validator: UI evidence remains an internal repo artifact, but is no longer a thesis-package requirement.
          vp = root / 'FINALDOCS/VALIDATION/verify_finaldocs_60q.py'
          v = vp.read_text(encoding='utf-8')
          v = re.sub(r'UI_CASES = \(.*?\)\n\n', '', v, flags=re.S)
          v = re.sub(r'\n    for case in UI_CASES:.*?(?=\n    text = MANUSCRIPT)', '\n', v, flags=re.S)
          v = v.replace('        "[그림 1-2]",\n', '')
          v = re.sub(r'\n    chapter_five = .*?if "build_figures_60q.py" in text:', '\n    if "build_figures_60q.py" in text:', v, flags=re.S)
          v = re.sub(r'\n    expected_guide_line = \(.*?if expected_guide_line not in guide:.*?\n', '\n', v, flags=re.S)
          # Strengthen manuscript ban for removed UI/service prose.
          anchor = '    defensive_phrases = ('
          insert = '''    ui_thesis_terms = (\n        "evidence replay",\n        "UI_REPLAY",\n        "서비스 화면",\n        "서비스 UI",\n        "API route",\n        "배포 상태",\n        "사용자 경험",\n    )\n    if found := [term for term in ui_thesis_terms if term.lower() in body.lower()]:\n        raise AssertionError(f"UI/service material leaked into thesis body: {found}")\n\n'''
          if 'ui_thesis_terms = (' not in v:
              v = v.replace(anchor, insert + anchor)
          vp.write_text(v, encoding='utf-8')

          # 7) One-shot guard: fail if removed terms remain in the thesis body.
          check = manuscript.read_text(encoding='utf-8')
          body = check.split('# 참고문헌',1)[0].split('# 1. 서론',1)[-1]
          forbidden = ['evidence replay', 'UI_REPLAY', '서비스 화면', '서비스 UI', 'API route', '배포 상태', '사용자 경험']
          leaked = [x for x in forbidden if x.lower() in body.lower()]
          if leaked:
              raise SystemExit(f'forbidden UI/service terms remain: {leaked}')
          PY

          rm -f .github/workflows/one-shot-thesis-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINALDOCS .github/workflows/one-shot-thesis-cleanup.yml
          git diff --cached --check
          git commit -m 'docs(thesis): remove UI material and finalize direct prose'
          git push origin HEAD:main
