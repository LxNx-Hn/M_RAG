name: Finalize thesis workbook once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-thesis-workbook-once.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Rebuild workbook from canonical HWP table text
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Alignment, Font, PatternFill, Border, Side
          from openpyxl.utils import get_column_letter

          src = Path("FINALDOCS/MANUSCRIPT/HWP_COPYPASTE_TABLES_60Q.txt")
          out = Path("FINALDOCS/TABLES/TABLES_60Q.xlsx")
          text = src.read_text(encoding="utf-8")

          pattern = re.compile(
              r"=+\n\[Workbook Sheet\] ([^\n]+)\n=+\n(.*?)(?=\n=+\n\[Workbook Sheet\]|\Z)",
              re.S,
          )
          sections = [(name.strip(), body.strip()) for name, body in pattern.findall(text)]

          expected = [
              "T2-1_Related_Work","T3-1_Requirements","T3-2_RAG-Cube",
              "T3-3_Factor_Position","T4-1_Environment","T4-2_Backbone",
              "T4-3_Runtime","T4-4_Record_Fields","T5-1_Dataset",
              "T5-2_Config_Scores","T5-3_HyDE","T5-4_CAD",
              "T5-5_SCD_Config","T5-6_SCD_Paired","Appendix_Queries",
              "Appendix_Paper","Appendix_QueryType",
          ]
          assert [name for name, _ in sections] == expected, [name for name, _ in sections]

          titles = {
              "T2-1_Related_Work": "표 2-1 관련 연구와 본 실험의 연결",
              "T3-1_Requirements": "표 3-1 연구 및 실험 요구사항",
              "T3-2_RAG-Cube": "표 3-2 RAG-Cube 2×2×2 실험 조건",
              "T3-3_Factor_Position": "표 3-3 실험 요인별 적용 위치와 비교 단위",
              "T4-1_Environment": "표 4-1 실험 실행 환경",
              "T4-2_Backbone": "표 4-2 고정 Paper-RAG backbone",
              "T4-3_Runtime": "표 4-3 조건별 생성 시간",
              "T4-4_Record_Fields": "표 4-4 생성 기록의 재현성 필드",
              "T5-1_Dataset": "표 5-1 4개 문서별 질의 구성",
              "T5-2_Config_Scores": "표 5-2 SCD 평가 프로토콜별 RAG-Cube 조건 평균",
              "T5-3_HyDE": "표 5-3 HyDE 주 비교 결과",
              "T5-4_CAD": "표 5-4 CAD 동일 문맥 주 비교 결과",
              "T5-5_SCD_Config": "표 5-5 SCD 조합별 한국어 문자 비율 변화",
              "T5-6_SCD_Paired": "표 5-6 SCD 대응쌍 분석 요약",
              "Appendix_Queries": "표 A-1 60개 질의–대상 문서 쌍",
              "Appendix_Paper": "표 B-1 문서별 탐색 분석",
              "Appendix_QueryType": "표 B-2 질문 유형별 탐색 분석",
          }

          def scalar(v):
              v = v.strip()
              if re.fullmatch(r"-?\d+", v):
                  return int(v)
              if re.fullmatch(r"-?\d+\.\d+", v):
                  return float(v)
              return v

          wb = Workbook()
          wb.remove(wb.active)
          thin = Side(style="thin", color="D9D9D9")
          header_fill = PatternFill("solid", fgColor="E8EDF3")
          group_fill = PatternFill("solid", fgColor="F3F5F7")
          title_fill = PatternFill("solid", fgColor="DCE6F1")

          for name, body in sections:
              ws = wb.create_sheet(name)
              lines = [ln for ln in body.splitlines() if ln.strip()]
              rows = [[scalar(x) for x in ln.split("\t")] for ln in lines]
              max_cols = max(len(r) for r in rows)

              ws.cell(1,1).value = titles[name]
              ws.merge_cells(start_row=1,start_column=1,end_row=1,end_column=max_cols)
              ws.cell(1,1).font = Font(bold=True, size=12)
              ws.cell(1,1).fill = title_fill
              ws.cell(1,1).alignment = Alignment(vertical="center")
              ws.row_dimensions[1].height = 23

              ws.cell(2,1).value = "Source: FINALDOCS/MANUSCRIPT/HWP_COPYPASTE_TABLES_60Q.txt"
              ws.merge_cells(start_row=2,start_column=1,end_row=2,end_column=max_cols)
              ws.cell(2,1).font = Font(italic=True, size=9, color="666666")

              for r_idx, row in enumerate(rows, start=3):
                  for c_idx, val in enumerate(row, start=1):
                      cell = ws.cell(r_idx,c_idx,value=val)
                      cell.alignment = Alignment(vertical="top", wrap_text=True)
                      cell.border = Border(bottom=thin)
                  first = str(row[0]) if row else ""
                  if first.startswith("[") and first.endswith("]"):
                      ws.merge_cells(start_row=r_idx,start_column=1,end_row=r_idx,end_column=max_cols)
                      ws.cell(r_idx,1).fill = group_fill
                      ws.cell(r_idx,1).font = Font(bold=True)
                  elif first.startswith("[표 ") or first.startswith("[진단값]"):
                      ws.merge_cells(start_row=r_idx,start_column=1,end_row=r_idx,end_column=max_cols)
                      ws.cell(r_idx,1).fill = group_fill
                      ws.cell(r_idx,1).font = Font(italic=True)
                  elif r_idx == 3 or first in ("조건","지표","비교","대상 문서","질문 유형","문서","요구사항","단계","구분","query ID","연구 흐름","요인","구성"):
                      for c_idx in range(1,max_cols+1):
                          ws.cell(r_idx,c_idx).fill = header_fill
                          ws.cell(r_idx,c_idx).font = Font(bold=True)

              for col in range(1,max_cols+1):
                  values=[str(ws.cell(r,col).value or "") for r in range(1,ws.max_row+1)]
                  width=min(55,max(10,max((len(v) for v in values), default=10)+2))
                  ws.column_dimensions[get_column_letter(col)].width=width
              ws.freeze_panes="A3"

          wb.save(out)

          # Binary + semantic validation.
          check = load_workbook(out, read_only=True, data_only=False)
          assert check.sheetnames == expected
          assert check["T4-1_Environment"]["B7"].value == "각 단계에서 확률이 가장 높은 토큰 선택"
          assert check["T5-3_HyDE"]["A4"].value == "근거 충실도"
          assert check["T5-6_SCD_Paired"]["D5"].value == "95% 신뢰구간"
          assert check["Appendix_Queries"].max_row == 63
          print("Workbook rebuilt and reopened:", out.stat().st_size, "bytes")
          PY

      - name: Commit rebuilt workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINALDOCS/TABLES/TABLES_60Q.xlsx
          git commit -m "docs(thesis): rebuild synchronized workbook"
          git push origin HEAD:main
