name: Thesis Figure 4-1 Replace
# rerun after right-margin fix
# final semantic/layout pass

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/thesis-fig4-1-replace.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install matplotlib pymupdf pillow
      - name: Regenerate figure 4-1
        run: python -X utf8 cli/finalize_thesis_figures.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py
          git diff --check
      - name: Commit figure
        run: |
          git config user.name "KiKi"
          git config user.email "51896910+LxNx-Hn@users.noreply.github.com"
          git add FINALDOCS/FIGURES/fig4_1_pipeline.png
          if ! git diff --cached --quiet; then
            git commit -m "fix(thesis): replace figure 4-1 hybrid retrieval flow"
            git push origin HEAD:main
          fi