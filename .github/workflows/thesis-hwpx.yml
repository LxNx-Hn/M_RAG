name: Thesis HWPX validation

on:
  push:
    branches: [main]
    paths: ['FINALDOCS/**', '.github/workflows/thesis-hwpx.yml']
  pull_request:
    paths: ['FINALDOCS/**', '.github/workflows/thesis-hwpx.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r FINALDOCS/BUILD/requirements.txt
      - run: pip install -r FINALDOCS/VALIDATION/requirements-statistics.txt
      - name: Validate thesis, research, poster and package
        run: python -X utf8 -m FINALDOCS.VALIDATION.validate_all --output "$RUNNER_TEMP/finaldocs-checks"
      - name: Rebuild from school template and verify again
        run: |
          python -X utf8 FINALDOCS/BUILD/build_thesis_hwpx.py --template FINALDOCS/DELIVERY/SCHOOL_TEMPLATE_CONVERTED.hwpx --page-map FINALDOCS/DELIVERY/PAGE_MAP_60Q.json --output "$RUNNER_TEMP/thesis-rebuild"
          python -X utf8 FINALDOCS/BUILD/verify_thesis_hwpx.py --file "$RUNNER_TEMP/thesis-rebuild/GRADUATION_REPORT_60Q_FINAL.hwpx" --report-dir "$RUNNER_TEMP/thesis-rebuild-checks"
          python -m compileall -q FINALDOCS/BUILD FINALDOCS/VALIDATION/verify_finaldocs_60q.py
      - name: Preserve validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-validation
          path: ${{ runner.temp }}/finaldocs-checks/VALIDATION_RESULT.json
