name: Fix thesis source-year mismatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix_thesis_source_year.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix CAD source-year typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('FINALDOCS/MANUSCRIPT/GRADUATION_REPORT_TRANSFER_KO_60Q.md')
          text = p.read_text(encoding='utf-8')
          old = 'FLAN (Chung et al., 2021).'
          new = 'FLAN (Chung et al., 2022).'
          if text.count(old) != 1:
              raise SystemExit(f'expected one manuscript match, got {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate final package
        run: |
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py | tee FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINALDOCS/MANUSCRIPT/GRADUATION_REPORT_TRANSFER_KO_60Q.md FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(thesis): align CAD source citation year"
          git push origin HEAD:main
