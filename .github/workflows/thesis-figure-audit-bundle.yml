name: Thesis Figure Audit Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/thesis-figure-audit-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-figure-audit-bundle
          path: |
            FINALDOCS/FIGURES/**/*.png
            FINALDOCS/EVIDENCE/IO_CASES/*.png
          if-no-files-found: error
          retention-days: 1