name: Thesis Figure Finalize
# rerun after E04 renderer fix
# final visual micro-fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/thesis-figure-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install matplotlib pymupdf pillow
      - name: Regenerate final figures
        run: python -X utf8 cli/finalize_thesis_figures.py
      - name: Regenerate evidence figures
        run: python -X utf8 cli/render_evidence_figures.py --output-dir "$GITHUB_WORKSPACE/FINALDOCS/EVIDENCE/IO_CASES"
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py 2>&1 | tee FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          git diff --check
      - name: Commit regenerated figures
        run: |
          git config user.name "KiKi"
          git config user.email "51896910+LxNx-Hn@users.noreply.github.com"
          git add FINALDOCS/FIGURES FINALDOCS/EVIDENCE/IO_CASES FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix(thesis): regenerate final verified figures"
            git push origin HEAD:main
          fi
