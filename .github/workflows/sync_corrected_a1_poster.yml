name: Validate A1 poster exports
on:
  push:
    paths:
      - 'FINALDOCS/POSTER/A1_FINAL_TITLE_CONFIRMED_20261010/M_RAG_A1_FINAL_EDITABLE.svg'
      - 'FINALDOCS/POSTER/A1_FINAL_TITLE_CONFIRMED_20261010/A1_COPYEDIT_MAP.json'
      - 'FINALDOCS/POSTER/A1_FINAL_TITLE_CONFIRMED_20261010/M_RAG_A1_FINAL_EDITABLE.pptx'
      - 'FINALDOCS/POSTER/A1_FINAL_TITLE_CONFIRMED_20261010/POSTER_REFERENCES_FULL.md'
      - 'FINALDOCS/POSTER/A1_FINAL_TITLE_CONFIRMED_20261010/POSTER_CASES_FULL.md'
      - 'FINALDOCS/POSTER/A1_FINAL_TITLE_CONFIRMED_20261010/rebuild_exports.py'
      - 'FINALDOCS/BUILD/poster_alignment.py'
      - '.github/workflows/sync_corrected_a1_poster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inkscape fonts-nanum fontconfig
          python -m pip install --quiet lxml pillow pymupdf fonttools
      - name: Verify committed poster manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('FINALDOCS/POSTER/A1_FINAL_TITLE_CONFIRMED_20261010')
          for name, expected in json.loads((root / 'SHA256_MANIFEST.json').read_text()).items():
              data = (root / name).read_bytes()
              if Path(name).suffix.lower() in {'.md', '.json', '.svg'}:
                  data = data.replace(b'\r\n', b'\n')
              actual = hashlib.sha256(data).hexdigest()
              assert actual == expected, name
          PY
      - name: Render temporary exports and verify editable PPTX
        shell: bash
        run: |
          cp -r FINALDOCS/POSTER/A1_FINAL_TITLE_CONFIRMED_20261010 "$RUNNER_TEMP/poster-check"
          python "$RUNNER_TEMP/poster-check/rebuild_exports.py" --build-dir "$GITHUB_WORKSPACE/FINALDOCS/BUILD"
