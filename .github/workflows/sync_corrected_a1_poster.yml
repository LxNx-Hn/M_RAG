name: Validate A1 poster exports
on:
  push:
    paths:
      - 'FINALDOCS/POSTER/FINAL/M_RAG_A1_FINAL_EDITABLE.svg'
      - 'FINALDOCS/POSTER/FINAL/A1_COPYEDIT_MAP.json'
      - 'FINALDOCS/POSTER/FINAL/M_RAG_A1_FINAL_EDITABLE.pptx'
      - 'FINALDOCS/POSTER/FINAL/rebuild_exports.py'
      - 'FINALDOCS/BUILD/poster_alignment.py'
      - 'FINALDOCS/BUILD/poster_checks.py'
      - 'FINALDOCS/VALIDATION/package_checks.py'
      - 'FINALDOCS/VALIDATION/ARTIFACT_MANIFEST.json'
      - '.github/workflows/sync_corrected_a1_poster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inkscape fonts-nanum fontconfig
          python -m pip install --quiet lxml pillow pymupdf fonttools
      - name: Verify protected submission files
        run: python -m FINALDOCS.VALIDATION.package_checks --poster
      - name: Render temporary exports and verify editable PPTX
        shell: bash
        run: |
          python FINALDOCS/POSTER/FINAL/rebuild_exports.py --build-dir "$GITHUB_WORKSPACE/FINALDOCS/BUILD" --output "$RUNNER_TEMP/poster-exports"
      - name: Preserve failed rendering diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poster-rendering-diagnostics
          path: |
            ${{ runner.temp }}/poster-exports/M_RAG_A1_FINAL_PRINT.pdf
            ${{ runner.temp }}/poster-exports/M_RAG_A1_FINAL_PREVIEW.png
            ${{ runner.temp }}/poster-exports/PDF_TEXT_DIAGNOSTIC.txt
