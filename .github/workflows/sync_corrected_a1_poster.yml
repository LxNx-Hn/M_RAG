name: Validate A1 poster exports
on:
  push:
    paths:
      - 'FINALDOCS/POSTER/FINAL/**'
      - 'FINALDOCS/BUILD/poster_alignment.py'
      - 'FINALDOCS/BUILD/poster_checks.py'
      - 'FINALDOCS/BUILD/build_poster.py'
      - 'FINALDOCS/ANALYSIS/**'
      - 'FINALDOCS/VALIDATION/package_checks.py'
      - 'FINALDOCS/VALIDATION/ARTIFACT_MANIFEST.json'
      - '.github/workflows/sync_corrected_a1_poster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install checking tools
        run: |
          python -m pip install --quiet lxml pymupdf openpyxl==3.1.5
          python -m pip install -r FINALDOCS/VALIDATION/requirements-analysis.txt
      # The print PDF and PNG are PowerPoint's own rendering of the PPTX
      # (FINALDOCS/BUILD/build_poster.py on Windows); CI checks the committed files.
      - name: Verify poster values, alignment and PPTX/SVG/PDF text
        run: python -m FINALDOCS.VALIDATION.package_checks --poster
      - name: Poster mutation tests
        working-directory: FINALDOCS/BUILD
        run: python -m unittest test_poster_alignment test_poster_evidence
