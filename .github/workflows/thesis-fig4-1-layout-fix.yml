name: Thesis Figure 4-1 Layout Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/thesis-fig4-1-layout-fix.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install --disable-pip-version-check matplotlib numpy pymupdf pillow

      - name: Regenerate thesis figures
        run: python -X utf8 cli/finalize_thesis_figures.py

      - name: Validate final package
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py | tee FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          git diff --check

      - name: Upload Figure 4-1 visual
        uses: actions/upload-artifact@v4
        with:
          name: thesis-fig4-1-layout-final
          path: FINALDOCS/FIGURES/fig4_1_pipeline.png
          retention-days: 1

      - name: Commit regenerated Figure 4-1
        run: |
          git config user.name "KiKi"
          git config user.email "51896910+LxNx-Hn@users.noreply.github.com"
          git add FINALDOCS/FIGURES/fig4_1_pipeline.png FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix(thesis): regenerate collision-free figure 4-1"
            git push origin HEAD:main
          fi
