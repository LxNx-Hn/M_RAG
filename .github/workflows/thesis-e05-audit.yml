name: Thesis Finalize

on:
  push:
    paths:
      - '.github/workflows/thesis-e05-audit.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean figure font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
      - name: Regenerate stored input output evidence
        run: python -X utf8 cli/render_evidence_figures.py --output-dir FINALDOCS/EVIDENCE/IO_CASES
      - name: Validate final thesis package
        run: |
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py | tee FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          git diff --check
      - name: Commit generated evidence
        run: |
          git config user.name "KiKi"
          git config user.email "51896910+LxNx-Hn@users.noreply.github.com"
          git add FINALDOCS/EVIDENCE/IO_CASES FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix(thesis): regenerate final evidence"
            git push
          fi
