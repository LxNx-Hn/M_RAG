name: Thesis Final Editor Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/thesis-final-editor-validate.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff and manuscript checks
        shell: bash
        run: |
          set -euo pipefail
          BASE=edacc61194825b6fa9e06e8bb7a0bac6c5cd9669
          echo "=== changed FINALDOCS files ==="
          git diff --name-only "$BASE"...HEAD -- FINALDOCS
          echo "=== diff check ==="
          git diff --check "$BASE"...HEAD -- FINALDOCS
          python - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path("FINALDOCS/MANUSCRIPT/GRADUATION_REPORT_TRANSFER_KO_60Q.md"),
              Path("FINALDOCS/MANUSCRIPT/HWP_COPYPASTE_TABLES_60Q.txt"),
              Path("FINALDOCS/MANUSCRIPT/HWP_TRANSFER_GUIDE_60Q.md"),
          ]
          legacy_patterns = {
              "19-query history": re.compile(r"(?<!\d)19개(?!\d)"),
              "41-query history": re.compile(r"(?<!\d)41개(?!\d)"),
              "retained": re.compile(r"retained", re.I),
              "held-out": re.compile(r"held-out", re.I),
              "extension stage": re.compile(r"extension\s*단계", re.I),
              "parameter freeze history": re.compile(r"parameter를\s*고정한\s*뒤", re.I),
              "legacy 19": re.compile(r"기존\s*19", re.I),
              "added 41": re.compile(r"추가한\s*41", re.I),
              "retained query stage": re.compile(r"retained\s*query\s*단계", re.I),
          }
          banned_negative = ("하지 않는다", "못한다", "보장하지 않는다", "볼 수 없다", "정답성을 보장하지 않는다", "정답성 자체를 직접 보장하지 않는다")
          for path in paths:
              text = path.read_text(encoding="utf-8")
              found = [name for name, pat in legacy_patterns.items() if pat.search(text)]
              if found:
                  raise SystemExit(f"legacy history remains in {path}: {found}")
              found_neg = [p for p in banned_negative if p in text]
              if found_neg:
                  raise SystemExit(f"negative prose remains in {path}: {found_neg}")

          manuscript = paths[0].read_text(encoding="utf-8")
          hwp_copy = paths[1].read_text(encoding="utf-8")
          guide = paths[2].read_text(encoding="utf-8")
          note = "SCD ON 품질 지표는 한국어로 변환된 평가 context를 사용한 configuration-level 기술통계이며, SCD의 주 효과 평가는 표 5-5와 표 5-6의 Korean-character ratio 대응 비교를 사용한다."
          for label, text in (("manuscript", manuscript), ("HWP copy", hwp_copy), ("HWP guide", guide)):
              if note not in text:
                  raise SystemExit(f"SCD table note missing from {label}")

          if "ext_midm_001" not in manuscript:
              raise SystemExit("E05 ext_midm_001 missing")
          e03 = manuscript.split("E03은", 1)[1].split("[입출력증빙삽입:", 1)[0]
          if "output-language control" not in e03 or "0.0000에서 0.7713" not in e03:
              raise SystemExit("E03 output-language-control wording mismatch")
          sec59 = manuscript.split("## 5.9 연구의 한계",1)[1].split("# 6. 결론",1)[0]
          sec64 = manuscript.split("## 6.4 제한점과 후속 검증",1)[1].split("# 참고문헌",1)[0]
          for label, section in (("5.9",sec59),("6.4",sec64)):
              if any(p in section for p in banned_negative):
                  raise SystemExit(f"negative prose remains in section {label}")
          print("PASS: editorial checks")
          PY

      - name: Run final package validator
        shell: bash
        run: |
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py | tee FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt

      - name: Commit validator output if changed
        shell: bash
        run: |
          git config user.name "KiKi"
          git config user.email "51896910+LxNx-Hn@users.noreply.github.com"
          git add FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(thesis): record final editor validation"
            git push origin HEAD:main
          fi
