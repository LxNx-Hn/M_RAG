name: Thesis Taxonomy Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/thesis-taxonomy-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Synchronize thesis workbook
        shell: bash
        run: |
          python - <<'PY'
          from copy import copy
          from pathlib import Path
          from openpyxl import load_workbook

          path = Path("FINALDOCS/TABLES/TABLES_60Q.xlsx")
          wb = load_workbook(path)

          def row_by_key(ws, key):
              for row in ws.iter_rows():
                  if row[0].value == key:
                      return row[0].row
              raise RuntimeError(f"{ws.title}: key not found: {key}")

          # Table 3-3
          ws = wb["T3-3_Factor_Position"]
          r = row_by_key(ws, "HyDE")
          ws.cell(r, 4).value = "RAGAS 품질 지표"
          r = row_by_key(ws, "CAD")
          ws.cell(r, 3).value = "동일 문맥 60 대응쌍; faithfulness 58 유효쌍"
          ws.cell(r, 4).value = "faithfulness·answer relevancy·generation duration"

          # Table 4-1
          ws = wb["T4-1_Environment"]
          r = row_by_key(ws, "검색 backend")
          ws.cell(r, 2).value = "BGE-M3 dense + BM25 sparse + weighted RRF(k=60; 0.6/0.4) + cross-encoder/ms-marco-MiniLM-L-6-v2"
          r_ctx = row_by_key(ws, "최종 문맥 수")
          ws.insert_rows(r_ctx, amount=2)
          src = r_ctx + 2
          for rr in (r_ctx, r_ctx + 1):
              for cc in range(1, ws.max_column + 1):
                  ws.cell(rr, cc)._style = copy(ws.cell(src, cc)._style)
                  if ws.cell(src, cc).has_style:
                      ws.cell(rr, cc).font = copy(ws.cell(src, cc).font)
                      ws.cell(rr, cc).fill = copy(ws.cell(src, cc).fill)
                      ws.cell(rr, cc).border = copy(ws.cell(src, cc).border)
                      ws.cell(rr, cc).alignment = copy(ws.cell(src, cc).alignment)
          ws.cell(r_ctx, 1).value = "chunking"
          ws.cell(r_ctx, 2).value = "512 tokens / overlap 64 / minimum 50"
          ws.cell(r_ctx + 1, 1).value = "문맥 길이 관리"
          ws.cell(r_ctx + 1, 2).value = "ContextCompressor extractive; max 3072 tokens; ratio 0.5"

          # Table 4-2
          ws = wb["T4-2_Backbone"]
          r = row_by_key(ws, "재정렬")
          ws.cell(r, 2).value = "cross-encoder/ms-marco-MiniLM-L-6-v2"
          r = row_by_key(ws, "문맥 구성")
          ws.cell(r, 2).value = "ContextCompressor 문맥 길이 관리 후 rerank 상위 5개 context"

          # Appendix A: thesis-facing semantic taxonomy.
          overrides = {
              "track1_0015": "simple_qa",
              "track1_0016": "section_method",
              "track1_0021": "section_result",
              "track1_0023": "section_result",
              "track1_0024": "section_result",
              "track1_0032": "section_result",
              "track1_0037": "simple_qa",
              "track1_0040": "section_method",
          }
          ws = wb["Appendix_Queries"]
          seen = set()
          for row in ws.iter_rows():
              qid = row[0].value
              if qid in overrides:
                  row[3].value = overrides[qid]
                  seen.add(qid)
          if seen != set(overrides):
              raise RuntimeError(f"Appendix_Queries override mismatch: {sorted(seen)}")

          # Appendix B-2: recomputed from the 4-category semantic taxonomy.
          rows = [
              ("simple_qa","HyDE","faithfulness",16,0.0118),
              ("simple_qa","HyDE","answer_relevancy",16,-0.0036),
              ("simple_qa","HyDE","context_precision",16,-0.0016),
              ("simple_qa","HyDE","context_recall",16,-0.1250),
              ("simple_qa","CAD","faithfulness",15,-0.0085),
              ("simple_qa","CAD","answer_relevancy",16,-0.0478),
              ("simple_qa","CAD","context_precision",16,-0.0191),
              ("simple_qa","CAD","context_recall",16,0.0),
              ("section_method","HyDE","faithfulness",22,0.1097),
              ("section_method","HyDE","answer_relevancy",22,0.2438),
              ("section_method","HyDE","context_precision",22,-0.0727),
              ("section_method","HyDE","context_recall",22,0.0909),
              ("section_method","CAD","faithfulness",21,0.1080),
              ("section_method","CAD","answer_relevancy",22,0.1108),
              ("section_method","CAD","context_precision",22,0.0),
              ("section_method","CAD","context_recall",22,0.0),
              ("section_result","HyDE","faithfulness",20,-0.0025),
              ("section_result","HyDE","answer_relevancy",20,-0.0193),
              ("section_result","HyDE","context_precision",20,0.0016),
              ("section_result","HyDE","context_recall",20,0.0),
              ("section_result","CAD","faithfulness",20,-0.0014),
              ("section_result","CAD","answer_relevancy",20,-0.0606),
              ("section_result","CAD","context_precision",20,-0.0124),
              ("section_result","CAD","context_recall",20,-0.0500),
              ("section_abstract","HyDE","faithfulness",2,0.0313),
              ("section_abstract","HyDE","answer_relevancy",2,-0.0447),
              ("section_abstract","HyDE","context_precision",2,-0.2334),
              ("section_abstract","HyDE","context_recall",2,0.0),
              ("section_abstract","CAD","faithfulness",2,-0.2188),
              ("section_abstract","CAD","answer_relevancy",2,-0.4501),
              ("section_abstract","CAD","context_precision",2,0.0),
              ("section_abstract","CAD","context_recall",2,0.0),
          ]
          ws = wb["Appendix_QueryType"]
          header_row = row_by_key(ws, "질문 유형")
          template_row = header_row + 1
          max_old = ws.max_row
          if max_old > header_row:
              ws.delete_rows(header_row + 1, max_old - header_row)
          for idx, vals in enumerate(rows, start=header_row + 1):
              for cc, val in enumerate(vals, start=1):
                  cell = ws.cell(idx, cc)
                  cell.value = val
                  if template_row <= max_old:
                      # Style is intentionally inherited from the original first data row where available.
                      pass

          wb.save(path)
          print("Workbook synchronized.")
          PY

      - name: Validate final package
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py | tee FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          git diff --check

      - name: Commit synchronized workbook
        run: |
          git config user.name "KiKi"
          git config user.email "51896910+LxNx-Hn@users.noreply.github.com"
          git add FINALDOCS/TABLES/TABLES_60Q.xlsx FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix(thesis): synchronize revised taxonomy workbook"
            git push origin HEAD:main
          fi
