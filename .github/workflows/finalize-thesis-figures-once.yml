name: Finalize thesis figures once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-thesis-figures-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fonts and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install --disable-pip-version-check matplotlib numpy pymupdf

      - name: Regenerate thesis project figures
        run: |
          python -X utf8 - <<'PY'
          from cli.finalize_thesis_figures import render_project_figures
          render_project_figures()
          PY

      - name: Commit regenerated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINALDOCS/FIGURES/fig4_1_pipeline.png                   FINALDOCS/FIGURES/fig4_2_artifact_flow.png                   FINALDOCS/FIGURES/fig5_0_evaluation_design.png                   FINALDOCS/FIGURES/fig5_1_quality_matrix.png                   FINALDOCS/FIGURES/fig5_9_hyde_cad_strata.png
          if git diff --cached --quiet; then
            echo "No figure changes."
            exit 0
          fi
          git commit -m "docs(figures): regenerate Korean thesis figures"
          git push origin HEAD:main
