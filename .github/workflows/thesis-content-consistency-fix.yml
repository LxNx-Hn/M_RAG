name: Thesis Content Consistency Fix

on:
  push:
    branches: [thesis-content-table-sync-v2]

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-content-table-sync-v2

      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Update thesis workbook content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          path = Path("FINALDOCS/TABLES/TABLES_60Q.xlsx")
          wb = load_workbook(path)
          replacements = {
              "동일 query·HyDE·CAD의 240 ON/OFF쌍":
                  "HyDE OFF 동일 문맥 120쌍; 전체 240 configuration-matched 쌍",
              "분석 artifact 참조": "105 / 6 / 9",
          }
          counts = {key: 0 for key in replacements}
          for ws in wb.worksheets:
              for row in ws.iter_rows():
                  for cell in row:
                      if isinstance(cell.value, str) and cell.value in replacements:
                          old = cell.value
                          cell.value = replacements[old]
                          counts[old] += 1

          allowed = {
              "동일 query·HyDE·CAD의 240 ON/OFF쌍": {0, 1},
              "분석 artifact 참조": {0, 1},
          }
          for key, count in counts.items():
              if count not in allowed[key]:
                  raise SystemExit(f"unexpected workbook replacement count for {key}: {count}")
          wb.save(path)
          print(counts)
          PY

      - name: Validate final package
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 FINALDOCS/VALIDATION/verify_finaldocs_60q.py | tee FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt
          git diff --check

      - name: Commit corrected workbook
        run: |
          git config user.name "KiKi"
          git config user.email "51896910+LxNx-Hn@users.noreply.github.com"
          rm -f .github/THESIS_CONTENT_FIX_TRIGGER
          git add FINALDOCS/TABLES/TABLES_60Q.xlsx FINALDOCS/VALIDATION/LAST_VALIDATOR_OUTPUT.txt .github/THESIS_CONTENT_FIX_TRIGGER
          if ! git diff --cached --quiet; then
            git commit -m "fix(thesis): synchronize corrected analysis tables"
            git push origin HEAD:thesis-content-table-sync-v2
          fi
