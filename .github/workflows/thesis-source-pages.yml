name: Thesis Source Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/thesis-source-pages.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pymupdf
      - name: Render source pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          import fitz

          sources = {
            'lost': 'https://arxiv.org/pdf/2307.03172',
            'cad': 'https://aclanthology.org/2024.naacl-short.69.pdf',
            'scd': 'https://arxiv.org/pdf/2511.09984',
          }
          out=Path('source-pages'); out.mkdir()
          for name,url in sources.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=90).read()
              p=out/f'{name}.pdf'; p.write_bytes(data)
              doc=fitz.open(p); page=doc[0]
              pix=page.get_pixmap(matrix=fitz.Matrix(3,3),alpha=False)
              pix.save(out/f'{name}_page1.png')
              doc.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-source-pages
          path: source-pages/*_page1.png
          retention-days: 1