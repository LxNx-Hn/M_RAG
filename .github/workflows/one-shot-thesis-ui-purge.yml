name: One-shot thesis UI purge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-thesis-ui-purge.yml'

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Purge residual UI references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          mdp = root / 'FINALDOCS/MANUSCRIPT/GRADUATION_REPORT_TRANSFER_KO_60Q.md'
          s = mdp.read_text(encoding='utf-8')

          # Remove orphaned appendix/UI figure-list entries and any residual UI figure references.
          s = re.sub(r'(?m)^\[그림 B-[0-9]+\].*\n?', '', s)
          s = re.sub(r'(?m)^\[그림 1-2\].*\n?', '', s)
          s = re.sub(r'(?m)^.*그림 1-2는.*\n?', '', s)
          s = re.sub(r'(?m)^.*(?:E01|E02|E03|E04|E05|E06).*(?:그림|사례|화면|replay).*\n?', '', s, flags=re.I)
          s = re.sub(r'(?im)^.*(?:evidence replay|UI_REPLAY|서비스 화면|서비스 UI|API route|배포 상태|사용자 경험).*$\n?', '', s)

          # Direct positive rewrites for remaining defensive formulations.
          repl = {
              '결과는 세 기법을 모두 적용한 조건이 모든 지표에서 우세한 구조가 아니라, 검색 관련성·근거 충실도·출력 언어 유지라는 목적에 따라 유리한 configuration이 달라짐을 보여준다.':
              '결과는 검색 관련성·근거 충실도·출력 언어 유지의 목표에 따라 지표별 최고 configuration이 달라짐을 보여준다.',
              'CAD faithfulness의 평균이 양수이면서도 win/loss/tie가 21/24/13으로 혼재하는 것은, 평균 변화가 특정 질의에서 일관된 개선 규칙을 뜻하지 않음을 명확히 한다.':
              'CAD faithfulness의 win/loss/tie는 21/24/13으로 분포하여 질의별 변화 방향이 다양하게 나타났다.',
              '네 strata가 모두 양의 변화를 보인다는 사실은 SCD의 언어 효과가 HyDE 또는 CAD의 특정 조합 하나에만 의존한 결과로 보이지 않는다는 점에서 의미가 있다.':
              '네 strata 모두에서 SCD ON−OFF Korean-character ratio가 양의 평균 변화를 보였다.',
              'Korean-character ratio는 그와 같은 혼합 표기를 오류로 취급하지 않으며, 영어 문맥을 그대로 따라 장문의 영어 문장을 생성하는 언어 이탈을 관찰하기 위한 제한된 지표다.':
              'Korean-character ratio는 한글 문자와 ASCII 영문자의 상대 비율을 사용해 출력 언어 성향을 정량화한다.',
              '본 연구의 설계적 의미는 세 기존 기법을 새 방법으로 제안했다는 데 있지 않다.':
              '본 연구의 설계적 의미는 세 기법의 적용 위치에 맞춘 통제 비교 구조에 있다.',
          }
          for a,b in repl.items():
              s = s.replace(a,b)

          # Remove empty runs created by deletions.
          s = re.sub(r'\n{3,}', '\n\n', s)
          mdp.write_text(s, encoding='utf-8')

          # HWP guide and web staging must not retain removed figure/UI references.
          gp = root / 'FINALDOCS/MANUSCRIPT/HWP_TRANSFER_GUIDE_60Q.md'
          if gp.exists():
              g = gp.read_text(encoding='utf-8')
              g = re.sub(r'(?im)^.*(?:E01|E02|E03|E04|E05|E06|evidence replay|UI_REPLAY|서비스 화면|서비스 UI|그림 1-2).*$\n?', '', g)
              gp.write_text(re.sub(r'\n{3,}', '\n\n', g), encoding='utf-8')

          hp = root / 'FINALDOCS/MANUSCRIPT/HWP_WEB_TRANSFER_60Q.html'
          if hp.exists():
              h = hp.read_text(encoding='utf-8')
              h = re.sub(r'<(?:p|li|tr|figure)[^>]*>.*?(?:E0[1-6]|evidence replay|UI_REPLAY|서비스 화면|서비스 UI|그림 1-2).*?</(?:p|li|tr|figure)>', '', h, flags=re.I|re.S)
              h = re.sub(r'<img[^>]*(?:UI_REPLAY|E0[1-6]_)[^>]*>', '', h, flags=re.I)
              hp.write_text(h, encoding='utf-8')

          # Update validator to reject orphaned UI references in the manuscript.
          vp = root / 'FINALDOCS/VALIDATION/verify_finaldocs_60q.py'
          v = vp.read_text(encoding='utf-8')
          if '"[그림 B-"' not in v:
              needle = '        "사용자 경험",\n'
              v = v.replace(needle, needle + '        "[그림 B-",\n        "그림 1-2",\n')
          vp.write_text(v, encoding='utf-8')

          # Final hard guard against thesis UI/service material and orphan references.
          body = mdp.read_text(encoding='utf-8').split('# 참고문헌',1)[0]
          forbidden = [
              'evidence replay', 'UI_REPLAY', '서비스 화면', '서비스 UI',
              'API route', '배포 상태', '사용자 경험', '[그림 B-', '그림 1-2',
              'E01_', 'E02_', 'E03_', 'E04_', 'E05_', 'E06_'
          ]
          leaked = [x for x in forbidden if x.lower() in body.lower()]
          if leaked:
              raise SystemExit(f'residual UI/service references: {leaked}')
          PY

          rm -f .github/workflows/one-shot-thesis-ui-purge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FINALDOCS .github/workflows/one-shot-thesis-ui-purge.yml
          git diff --cached --check
          git commit -m 'docs(thesis): purge residual UI references'
          git push origin HEAD:main
