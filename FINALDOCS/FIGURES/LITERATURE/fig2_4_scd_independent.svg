<svg xmlns="http://www.w3.org/2000/svg" width="159mm" height="79.5mm" viewBox="0 0 1800 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="900" y="80.0" font-family="Malgun Gothic" font-size="44" text-anchor="middle" fill="#24324A">SCD는 토큰 그룹별로 로짓에 계수를 곱함</text><rect x="40" y="210" width="490" height="190" rx="12" fill="#FAF9FC" stroke="#2F6DF6" stroke-width="4"/><text x="285.0" y="291.34999999999997" font-family="Malgun Gothic" font-size="42" text-anchor="middle" fill="#24324A">한국어 목표 토큰</text><text x="285.0" y="348.04999999999995" font-family="Malgun Gothic" font-size="42" text-anchor="middle" fill="#24324A">z′ = 1.1 × z</text><rect x="655" y="210" width="490" height="190" rx="12" fill="#FAF9FC" stroke="#CF6800" stroke-width="4"/><text x="900.0" y="291.34999999999997" font-family="Malgun Gothic" font-size="42" text-anchor="middle" fill="#24324A">비목표 언어 토큰</text><text x="900.0" y="348.04999999999995" font-family="Malgun Gothic" font-size="42" text-anchor="middle" fill="#24324A">z′ = 0.9 × z</text><rect x="1270" y="210" width="490" height="190" rx="12" fill="#FAF9FC" stroke="#695184" stroke-width="4"/><text x="1515.0" y="291.34999999999997" font-family="Malgun Gothic" font-size="42" text-anchor="middle" fill="#24324A">중립 토큰</text><text x="1515.0" y="348.04999999999995" font-family="Malgun Gothic" font-size="42" text-anchor="middle" fill="#24324A">z′ = z</text><text x="900" y="535.0" font-family="Malgun Gothic" font-size="42" text-anchor="middle" fill="#24324A">이미 생성한 토큰 5개부터 적용, 그 이전에는 기본 로짓 유지</text><text x="900" y="635.0" font-family="Malgun Gothic" font-size="42" text-anchor="middle" fill="#24324A">CAD와 함께 적용하면 CAD 로짓 결합 뒤에 SCD 계수 적용</text><text x="900" y="755.0" font-family="Malgun Gothic" font-size="44" text-anchor="middle" fill="#24324A">출력 언어는 한글 / (한글 + ASCII 영문자)로 측정</text></svg>