<svg xmlns="http://www.w3.org/2000/svg" width="159mm" height="75.08333333333333mm" viewBox="0 0 1800 850"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24324A"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="900" y="75.0" font-family="Malgun Gothic" font-size="44" text-anchor="middle" fill="#24324A">CAD: 문맥 포함·제외 입력에서 계산한 로짓의 결합</text><rect x="70" y="150" width="650" height="200" rx="12" fill="#FAF9FC" stroke="#16846F" stroke-width="4"/><text x="395.0" y="210.0" font-family="Malgun Gothic" font-size="40" text-anchor="middle" fill="#24324A">질문 + 검색 문맥</text><text x="395.0" y="264.0" font-family="Malgun Gothic" font-size="40" text-anchor="middle" fill="#24324A">+ 생성 접두 시퀀스</text><text x="395.0" y="318.0" font-family="Malgun Gothic" font-size="40" text-anchor="middle" fill="#24324A">문맥 포함 로짓 z_ctx</text><rect x="70" y="410" width="650" height="200" rx="12" fill="#FAF9FC" stroke="#695184" stroke-width="4"/><text x="395.0" y="497.0" font-family="Malgun Gothic" font-size="40" text-anchor="middle" fill="#24324A">질문 + 생성 접두 시퀀스</text><text x="395.0" y="551.0" font-family="Malgun Gothic" font-size="40" text-anchor="middle" fill="#24324A">문맥 제외 로짓 z_noctx</text><rect x="1000" y="270" width="720" height="190" rx="12" fill="#FAF9FC" stroke="#16846F" stroke-width="4"/><text x="1360.0" y="352.0" font-family="Malgun Gothic" font-size="40" text-anchor="middle" fill="#24324A">z_CAD = (1+α) z_ctx − α z_noctx</text><text x="1360.0" y="406.0" font-family="Malgun Gothic" font-size="40" text-anchor="middle" fill="#24324A">본 실험: α=0.5</text><polyline points="735,245 890,245 890,330 980,330" fill="none" stroke="#24324A" stroke-width="4" marker-end="url(#arrow)"/><polyline points="735,485 890,485 890,410 980,410" fill="none" stroke="#24324A" stroke-width="4" marker-end="url(#arrow)"/><text x="900" y="700.0" font-family="Malgun Gothic" font-size="42" text-anchor="middle" fill="#24324A">CAD 적용 시 각 토큰의 최종 점수에 검색 문맥의 영향을 반영</text></svg>