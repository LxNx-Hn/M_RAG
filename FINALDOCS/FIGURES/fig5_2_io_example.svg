   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #695184" x="4.248" y="15.647188" transform="rotate(-0 4.248 15.647188)">질문</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 17.079805)">RAPTOR의 클러스터링 과정에서 Bayesian Information</text>
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 32.717422)">Criterion(BIC)은 어떤 결정을 내리는 데 사용됩니까?</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #695184" x="4.248" y="62.321563" transform="rotate(-0 4.248 62.321563)">참조 답변</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #263044" x="85.428" y="63.637695" transform="rotate(-0 85.428 63.637695)">to determine the optimal number of clusters (원문 4쪽)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #695184" x="4.248" y="93.362188" transform="rotate(-0 4.248 93.362188)">입력 구간</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 94.355938)">To determine the optimal number of clusters, we employ</text>
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 109.580938)">the Bayesian Information Criterion (BIC) for model</text>
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 125.951914)">selection.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #695184" x="4.248" y="155.237188" transform="rotate(-0 4.248 155.237188)">생성 답변</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 157.241563)">제공된 논문 컨텍스트를 분석한 결과, RAPTOR의 클러스터링</text>
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 171.894805)">과정에서 Bayesian Information Criterion(BIC)은 최적의</text>
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 187.968008)">클러스터 개수 결정을 위해 사용됨이 확인됩니다.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #695184" x="4.248" y="217.112188" transform="rotate(-0 4.248 217.112188)">평가값</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 219.228945)">근거 충실도 0.857 · 답변 관련성 0.895 / 문맥 정밀도 0.700</text>
    <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; fill: #263044" transform="translate(85.428 234.576992)">· 문맥 재현율 1.000</text>
   </g>
