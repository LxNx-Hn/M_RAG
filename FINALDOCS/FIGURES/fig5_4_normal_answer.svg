    <text style="font-size: 7.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #222222" x="12.9096" y="426.276987" transform="rotate(-0 12.9096 426.276987)">faithfulness=1.0 · answer_relevancy=0.9365 · context_precision=1.0 · context_recall=1.0</text>
