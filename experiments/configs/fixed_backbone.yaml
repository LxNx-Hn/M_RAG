name: fixed-paper-rag-backbone
description: Fixed Paper-RAG retrieval backbone used by the final 60-query HyDE/CAD/SCD thesis experiment.
retrieval:
  dense:
    enabled: true
    model: BAAI/bge-m3
  sparse:
    enabled: true
    method: BM25
  fusion:
    enabled: true
    method: weighted_rrf
    rrf_k: 60
    dense_weight: 0.6
    sparse_weight: 0.4
  reranker:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
frozen_parameters:
  retrieval_pool_top_k: 8
  rerank_top_n: 8
  context_chunk_count: 5
  section_filter: null
  doc_id_filter: set_by_query_or_runtime_scope
parameter_semantics:
  retrieval_pool_top_k: initial dense/BM25 candidate count before fusion
  rerank_top_n: count retained after CrossEncoder reranking
  context_chunk_count: final chunk count passed to generation
excluded_from_fixed_backbone:
  hyde: main_experiment_axis
  cad: main_experiment_axis
  scd: main_experiment_axis
forbidden_backbone_claims:
  new_retrieval_method: false
  multi_query_fusion: false
  hierarchical_third_party_retrieval_claim: false
  compression_method_claim: false
