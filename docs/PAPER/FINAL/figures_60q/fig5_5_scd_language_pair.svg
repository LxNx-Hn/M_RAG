    </g>
    <g clip-path="url(#p90642a0f08)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(413.9244 78.938164)">논문에서 언급된 세 가지 방법 중 파인튜닝과 프롬프트 엔지니어링의 특징을 비교하여 설명해주세요</text>
