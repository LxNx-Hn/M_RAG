    <g clip-path="url(#p90642a0f08)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(413.9244 100.043502)">[질문] 파인튜닝과 프롬프트 엔지니어링의 차이점을 설명하고 각각의 장단점을 비교해주세요</text>
    </g>
