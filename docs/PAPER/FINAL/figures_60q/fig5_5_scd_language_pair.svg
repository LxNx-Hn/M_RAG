   <g id="text_1">
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 47.402094)">때 어떤 차이점이 있는지 설명해주세요</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 57.832827)"/>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 68.263559)">Answer:</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 78.694292)"/>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 90.197708)">제공된 논문 컨텍스트를 바탕으로 RAG(Retrieval-Augmented</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 101.742561)">Generation)와 파인튜닝(Fine-tuning) 간의 주요 차이점을 설명드리겠습니다.</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 112.214731)"/>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 122.645464)">## 1. 외부 지식 요구사항 측면</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 133.076197)"/>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 143.750802)">**RAG(검색 증강 생성)**</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 154.181534)">- 외부 지식에 크게 의존하는 방식으로, 문서에서 언급된 바와 같이 "RAG relies on</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 165.739733)">external knowledge to enhance LLMs"(RAG는 LLM 향상을 위해</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 176.455775)">외부 지식에 의존한다)</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 187.013745)">- "RAG excels in dynamic environments by offering</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 197.613153)">realtime knowledge updates and effective utilization</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 208.212561)">of external knowledge sources with high</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 219.757414)">interpretability"(RAG는 실시간 지식 업데이트와 높은 해석 가능성을 가진 외부</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 230.583022)">지식 소스의 효과적 활용으로 동적 환경에서 탁월하다)</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 241.013755)"/>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 251.688359)">**파인튜닝(미세조정)**</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 262.119092)">- 상대적으로 외부 지식 의존도가 낮으며, 모델 자체의 내재적 능력에 더 중점을 둠</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 272.677062)">- "Unsupervised fine-tuning shows some improvement,</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 284.221916)">RAG consistently outperforms it"(비지도 미세조정은 일부 개선을</text>
    </g>
    <g clip-path="url(#pbbfc365718)">
     <text style="font-size: 7.8px; font-family: 'Malgun Gothic'; fill: #222222" transform="translate(11.0394 294.937958)">보이지만, RAG가 일관되게 이를 능가한다) … [이하 생략]</text>
    </g>
   </g>
