<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">M-RAG research and service architecture</title><desc id="desc">The fixed Paper-RAG backbone feeds a controlled HyDE, CAD, and SCD experiment and an A through F service router.</desc>
  <defs><style>.title{font:700 28px Arial;fill:#17324d}.label{font:700 20px Arial;fill:#17324d}.body{font:16px Arial;fill:#253746}.small{font:14px Arial;fill:#425466}.box{fill:#f5f8fb;stroke:#557a9e;stroke-width:2}.research{fill:#e8f2ff;stroke:#2563a6;stroke-width:2}.service{fill:#eef8ee;stroke:#3d7a46;stroke-width:2}.arrow{stroke:#50677d;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#50677d"/></marker></defs>
  <text x="600" y="42" text-anchor="middle" class="title">M-RAG: Research Layer and Service Layer</text>
  <rect x="55" y="100" width="205" height="100" rx="14" class="box"/><text x="158" y="137" text-anchor="middle" class="label">Paper Corpus</text><text x="158" y="169" text-anchor="middle" class="body">parse · section · chunk</text>
  <rect x="330" y="82" width="330" height="136" rx="14" class="box"/><text x="495" y="120" text-anchor="middle" class="label">Fixed Paper-RAG Backbone</text><text x="495" y="153" text-anchor="middle" class="body">BGE-M3 + BM25 + weighted RRF</text><text x="495" y="182" text-anchor="middle" class="body">CrossEncoder reranking · context top 5</text><path d="M260 150H330" class="arrow"/>
  <rect x="750" y="65" width="390" height="190" rx="14" class="research"/><text x="945" y="106" text-anchor="middle" class="label">Controlled Research Layer</text><text x="945" y="141" text-anchor="middle" class="body">HyDE on/off × CAD on/off × SCD on/off</text><text x="945" y="174" text-anchor="middle" class="body">8 configurations · 19 queries · 152 outputs</text><text x="945" y="207" text-anchor="middle" class="small">Mi:dm 2.0 Base held fixed</text><path d="M660 150H750" class="arrow"/>
  <rect x="160" y="355" width="880" height="225" rx="18" class="service"/><text x="600" y="397" text-anchor="middle" class="label">Graduation-Project Service Layer</text><text x="600" y="430" text-anchor="middle" class="body">FastAPI · React · streaming · source display · active-document filtering</text>
  <g class="body" text-anchor="middle"><rect x="205" y="470" width="120" height="64" rx="10" class="box"/><text x="265" y="509">A · QA</text><rect x="340" y="470" width="120" height="64" rx="10" class="box"/><text x="400" y="499">B · Section</text><text x="400" y="519">QA</text><rect x="475" y="470" width="120" height="64" rx="10" class="box"/><text x="535" y="509">C · Compare</text><rect x="610" y="470" width="120" height="64" rx="10" class="box"/><text x="670" y="499">D · Citation</text><text x="670" y="519">lookup</text><rect x="745" y="470" width="120" height="64" rx="10" class="box"/><text x="805" y="509">E · Summary</text><rect x="880" y="470" width="120" height="64" rx="10" class="box"/><text x="940" y="499">F · Quiz /</text><text x="940" y="519">flashcard</text></g>
  <path d="M495 218V318H600V355" class="arrow"/><text x="510" y="302" class="small">shared retrieval backbone</text><text x="600" y="622" text-anchor="middle" class="small">The service router demonstrates integration; it is not claimed as the thesis algorithm.</text>
</svg>
