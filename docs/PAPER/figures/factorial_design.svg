<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">HyDE CAD SCD full factorial experiment</title><desc id="desc">Three binary factors create eight configurations, each evaluated over the same nineteen queries.</desc>
  <defs><style>.title{font:700 28px Arial;fill:#17324d}.h{font:700 21px Arial;fill:#17324d}.b{font:16px Arial;fill:#253746}.s{font:14px Arial;fill:#425466}.base{fill:#f5f8fb;stroke:#557a9e;stroke-width:2}.factor{fill:#e8f2ff;stroke:#2563a6;stroke-width:2}.out{fill:#eef8ee;stroke:#3d7a46;stroke-width:2}.a{stroke:#50677d;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#50677d"/></marker></defs>
  <text x="600" y="42" text-anchor="middle" class="title">Controlled HyDE × CAD × SCD Factorial Design</text>
  <rect x="55" y="95" width="260" height="150" rx="14" class="base"/><text x="185" y="132" text-anchor="middle" class="h">Frozen Inputs</text><text x="185" y="168" text-anchor="middle" class="b">19 Korean queries</text><text x="185" y="198" text-anchor="middle" class="b">4 English papers</text><text x="185" y="225" text-anchor="middle" class="s">same backbone and model</text><path d="M315 170H390" class="a"/>
  <rect x="390" y="78" width="420" height="185" rx="14" class="factor"/><text x="600" y="116" text-anchor="middle" class="h">Three Binary Factors</text><text x="600" y="155" text-anchor="middle" class="b">HyDE: retrieval reformulation on / off</text><text x="600" y="190" text-anchor="middle" class="b">CAD: context-aware decoding on / off</text><text x="600" y="225" text-anchor="middle" class="b">SCD: Korean language control on / off</text><path d="M810 170H885" class="a"/>
  <rect x="885" y="95" width="260" height="150" rx="14" class="out"/><text x="1015" y="132" text-anchor="middle" class="h">Executed Matrix</text><text x="1015" y="168" text-anchor="middle" class="b">8 configurations</text><text x="1015" y="198" text-anchor="middle" class="b">152 generations</text><text x="1015" y="225" text-anchor="middle" class="s">paired factor contrasts</text>
  <rect x="130" y="340" width="940" height="195" rx="16" class="base"/><text x="600" y="378" text-anchor="middle" class="h">Measurement Boundary</text><text x="325" y="422" text-anchor="middle" class="b">Measured</text><text x="325" y="454" text-anchor="middle" class="s">faithfulness · answer relevancy</text><text x="325" y="480" text-anchor="middle" class="s">context precision · context recall</text><text x="325" y="506" text-anchor="middle" class="s">direct Korean-language adherence</text><line x1="600" y1="405" x2="600" y2="510" stroke="#9aaabd" stroke-width="2"/><text x="840" y="422" text-anchor="middle" class="b">Deferred, not scored as zero</text><text x="840" y="462" text-anchor="middle" class="s">query-type effects</text><text x="840" y="490" text-anchor="middle" class="s">numeric-exactness annotation</text><text x="600" y="582" text-anchor="middle" class="s">Historical v1 and corrected reference_scd result tracks remain explicitly separated.</text>
</svg>
