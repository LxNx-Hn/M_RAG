<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
<title id="title">영어 학술논문 질의응답과 기존 기법의 적용 위치</title>
<desc id="desc">한국어 질문에서 검색, LLM, 답변으로 이어지는 가로 흐름. 영어 논문은 검색에 입력된다. HyDE는 검색에, CAD와 SCD는 LLM 생성 중에 적용된다.</desc>
